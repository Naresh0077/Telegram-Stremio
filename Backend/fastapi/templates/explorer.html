<!DOCTYPE html>
<html lang="en" data-server-dark="{{ 1 if theme.is_dark else 0 }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>File Explorer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M2 7a2 2 0 0 1 2-2h7l3 3h14a2 2 0 0 1 2 2v15a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2z' fill='%23f4c23d'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
<style>
:root{
  --accent:#0067c0; --chrome:#f3f3f3; --content:#ffffff; --card:#ffffff; --hover:#e5f3ff; --sel:#cce8ff; --sel-line:#99d1ff;
  --text:#1a1a1a; --muted:#5f5f5f; --line:#e0e0e0; --ctl-hover:rgba(0,0,0,.055); --shadow:0 8px 30px rgba(0,0,0,.18);
  color-scheme: light;
}
:root[data-theme="dark"]{
  --accent:#60cdff; --chrome:#202020; --content:#191919; --card:#2b2b2b; --hover:rgba(255,255,255,.06); --sel:rgba(96,205,255,.16); --sel-line:rgba(96,205,255,.55);
  --text:#ffffff; --muted:#a6a6a6; --line:#323232; --ctl-hover:rgba(255,255,255,.08); --shadow:0 8px 30px rgba(0,0,0,.6);
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'Segoe UI Variable Text','Segoe UI Variable','Segoe UI',system-ui,-apple-system,'Inter',sans-serif;background:var(--chrome);color:var(--text);font-size:14px;overflow:hidden;
  padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
.app{display:grid;grid-template-rows:auto auto auto 1fr auto;height:100%}
.row{display:flex;align-items:center;gap:4px}
.btn{height:32px;min-width:32px;padding:0 9px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;font-size:13px}
.btn:hover:not(:disabled){background:var(--ctl-hover)} .btn:disabled{opacity:.32;cursor:default}
.btn.primary{background:var(--accent);color:#fff} :root[data-theme="dark"] .btn.primary{color:#000}
.btn.active{background:var(--ctl-hover)}
.btn i{font-size:14px}
.sep{width:1px;height:18px;background:var(--line);margin:0 5px;flex:none}
/* tab strip */
.tabs{padding:6px 10px 0;display:flex;align-items:flex-end;min-height:38px}
.tab{background:var(--content);border-radius:8px 8px 0 0;padding:7px 14px;display:flex;align-items:center;gap:9px;max-width:300px;font-size:12.5px;box-shadow:0 0 0 1px var(--line) inset;border-bottom:0}
.tab span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab svg{width:16px;height:16px;flex:none}
/* toolbar */
.top{padding:6px 10px;gap:6px;background:var(--content)}
.addr{flex:1;min-width:0;height:34px;background:var(--card);border:1px solid var(--line);border-bottom-color:var(--muted);border-radius:5px;padding:0 6px 0 9px;overflow:hidden;gap:8px}
:root[data-theme="dark"] .addr{border-bottom-color:var(--line)}
.addr:focus-within{border-bottom:2px solid var(--accent)}
.crumbs{display:flex;align-items:center;gap:0;overflow-x:auto;white-space:nowrap;scrollbar-width:none;flex:1}
.crumbs::-webkit-scrollbar{display:none}
.crumb{padding:3px 6px;border-radius:4px;cursor:pointer} .crumb:hover{background:var(--ctl-hover)}
.chev{color:var(--muted);font-size:8px;padding:0 1px}
.search{position:relative;width:min(280px,34vw)}
.search input{width:100%;height:34px;border-radius:5px;border:1px solid var(--line);border-bottom-color:var(--muted);background:var(--card);padding:0 32px 0 11px;outline:none}
:root[data-theme="dark"] .search input{border-bottom-color:var(--line)}
.search input:focus{border-bottom:2px solid var(--accent)}
.search i{position:absolute;right:11px;top:11px;color:var(--muted);pointer-events:none;font-size:12px}
/* command bar */
.cmd{padding:3px 10px 5px;gap:1px;overflow-x:auto;scrollbar-width:none;background:var(--content);border-bottom:1px solid var(--line)}
.cmd::-webkit-scrollbar{display:none}
.cmd select{height:28px;background:transparent;border:1px solid var(--line);border-radius:5px;padding:0 6px;max-width:150px;font-size:12.5px}
.cmd select option{color:#000}
/* body */
.main{display:grid;grid-template-columns:232px 1fr auto;min-height:0;background:var(--content)}
.nav{background:var(--chrome);overflow:auto;padding:6px 6px 20px}
.nav h6{margin:12px 10px 3px;font-size:11.5px;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;align-items:center}
.ni{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:4px;cursor:pointer;position:relative;user-select:none;min-height:32px}
.ni:hover{background:var(--ctl-hover)} .ni.active{background:var(--ctl-hover)}
.ni.active::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--accent)}
.ni .ic{width:18px;text-align:center;font-size:15px;flex:none;color:var(--accent)}
.ni svg.ic{width:18px;height:18px}
.ni .n{margin-left:auto;color:var(--muted);font-size:12px}
.ni .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ni.drop{outline:2px dashed var(--accent);outline-offset:-2px}
.tw{width:14px;text-align:center;color:var(--muted);font-size:9px;cursor:pointer;flex:none}
.content{overflow:auto;position:relative;background:var(--content);border-top-left-radius:8px;border-left:1px solid var(--line);border-top:1px solid var(--line)}
.pad{padding:10px 12px 40px}
/* icon view - 6 per row */
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.card{border-radius:4px;padding:8px 6px 6px;cursor:default;border:1px solid transparent;position:relative;user-select:none;text-align:center}
.card:hover{background:var(--hover)}
.card.sel{background:var(--sel);border-color:var(--sel-line)}
.card.drop{outline:2px dashed var(--accent)}
.thumb{aspect-ratio:16/10;border-radius:3px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;background:transparent}
.thumb.has{background:#000;box-shadow:0 0 0 1px var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .big{font-size:clamp(30px,4.4vw,62px)}
.thumb .badge{position:absolute;right:5px;bottom:5px;background:rgba(0,0,0,.72);color:#fff;font-size:11px;padding:1px 6px;border-radius:3px}
.thumb .ext{position:absolute;left:5px;top:5px;background:rgba(0,0,0,.55);color:#fff;font-size:10px;padding:1px 5px;border-radius:3px;text-transform:uppercase}
.fold{width:68%;max-width:120px;height:auto;aspect-ratio:1}
.nm{margin-top:6px;line-height:1.28;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word;font-size:12.5px;padding:0 2px}
.star{position:absolute;left:10px;top:10px;color:#f5b301;text-shadow:0 1px 3px rgba(0,0,0,.6);font-size:13px;z-index:2}
/* details (list) view */
table{width:100%;border-collapse:collapse}
th{position:sticky;top:0;background:var(--content);text-align:left;font-weight:400;color:var(--muted);padding:6px 10px;cursor:pointer;white-space:nowrap;z-index:2;font-size:12.5px;border-right:1px solid var(--line)}
th:hover{background:var(--ctl-hover)}
td{padding:0 10px;height:30px;white-space:nowrap;max-width:46vw;overflow:hidden;text-overflow:ellipsis;font-size:13px}
tr.fr{cursor:default;user-select:none} tr.fr:hover td{background:var(--hover)} tr.fr.sel td{background:var(--sel)}
tr.fr.drop td{outline:1px dashed var(--accent)}
td.name .ic{margin-right:9px;width:16px;text-align:center;font-size:14px}
td.name svg{width:16px;height:16px;vertical-align:-3px;margin-right:9px}
td.sz{text-align:right}
.sec{margin:8px 0 8px;font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
.sec small{color:var(--muted);font-weight:400;font-size:12.5px}
.chcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-bottom:20px}
.chcard{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:11px 12px;cursor:pointer;display:flex;gap:12px;align-items:center}
.chcard:hover{background:var(--hover);border-color:var(--sel-line)}
.chcard i{font-size:22px;color:var(--accent)}
.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted);text-align:center;padding:30px}
.empty i{font-size:56px;opacity:.35}
/* details pane */
.details{width:290px;background:var(--content);border-left:1px solid var(--line);overflow:auto;padding:14px;display:none}
.details.open{display:block}
.details .pv{aspect-ratio:16/10;border-radius:4px;background:var(--chrome);display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:12px}
.details .pv img{width:100%;height:100%;object-fit:cover} .details .pv i{font-size:48px}
.details h3{margin:0 0 10px;font-size:15px;font-weight:600;word-break:break-word}
.kv{display:grid;grid-template-columns:92px 1fr;gap:6px 8px;font-size:12.5px}
.kv div:nth-child(odd){color:var(--muted)} .kv div:nth-child(even){word-break:break-word}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.acts .btn{border:1px solid var(--line);height:30px;font-size:12.5px}
/* status bar */
.status{padding:2px 12px;color:var(--muted);font-size:12px;display:flex;gap:12px;align-items:center;min-height:26px;background:var(--content);border-top:1px solid var(--line)}
.bar{height:4px;width:110px;background:var(--line);border-radius:3px;overflow:hidden;display:inline-block;vertical-align:middle}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.status .btn{height:22px;min-width:24px;padding:0 6px}
/* menus / dialogs */
.menu{position:fixed;z-index:60;min-width:220px;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:4px}
.menu .mi{padding:7px 10px;border-radius:4px;cursor:pointer;display:flex;gap:11px;align-items:center;font-size:13px}
.menu .mi:hover{background:var(--ctl-hover)} .menu .mi i{width:16px;text-align:center;color:var(--muted)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:70;display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);width:min(460px,100%);max-height:86vh;overflow:auto;padding:20px}
.dlg h4{margin:0 0 12px;font-size:17px;font-weight:600}
.dlg input[type=text]{width:100%;height:34px;border-radius:5px;border:1px solid var(--line);border-bottom-color:var(--muted);background:var(--chrome);padding:0 10px;outline:none}
.dlg input[type=text]:focus{border-bottom:2px solid var(--accent)}
.dlg .ft{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.dlg .ft .btn{border:1px solid var(--line);min-width:84px}
.dlg .ft .btn.primary{border-color:var(--accent)}
.dlg p{color:var(--muted);line-height:1.5;margin:8px 0}
.dlg ol{margin:8px 0;padding-left:20px;line-height:1.7}
.toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);padding:10px 16px;border-radius:6px;z-index:90}
/* viewer (images / pdf / text only) */
.viewer{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.92);display:flex;flex-direction:column;color:#fff;padding-top:env(safe-area-inset-top,0)}
.vtop{display:flex;align-items:center;gap:8px;padding:10px 14px;flex-wrap:wrap}
.vtop .ttl{flex:1;min-width:140px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.vtop .btn{color:#fff;border:1px solid rgba(255,255,255,.2);height:32px}
.vtop .btn:hover{background:rgba(255,255,255,.14)!important}
.stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}
.stage img{max-width:100%;max-height:100%;object-fit:contain}
.stage iframe{width:100%;height:100%;border:0;background:#fff}
.stage pre{margin:0;padding:18px;overflow:auto;width:100%;height:100%;font:13px/1.5 Consolas,monospace;white-space:pre-wrap;word-break:break-word;color:#e8e8e8}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px;background:rgba(0,0,0,.72)}
.overlay .btn{border:1px solid rgba(255,255,255,.3);color:#fff}
.spin{width:38px;height:38px;border:4px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.burger{display:none}
@media (max-width:1280px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media (max-width:1100px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:820px){
  .main{grid-template-columns:1fr}
  .nav{position:fixed;left:0;top:0;bottom:0;width:262px;z-index:55;transform:translateX(-102%);transition:transform .2s;box-shadow:var(--shadow);padding-top:calc(10px + env(safe-area-inset-top,0))}
  .nav.open{transform:none}
  .burger{display:inline-flex}
  .search{width:100%}
  .top{flex-wrap:wrap}
  .addr{order:3;flex-basis:100%}
  .details{position:fixed;right:0;top:0;bottom:0;width:min(320px,92vw);z-index:56;box-shadow:var(--shadow)}
  .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  td.hm,th.hm{display:none}
  .pad{padding:8px 6px 40px}
  .tabs{display:none}
}
@media (max-width:520px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="fg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9a826"/><stop offset="1" stop-color="#d48f10"/></linearGradient>
  <linearGradient id="fg2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe083"/><stop offset="1" stop-color="#ffc83d"/></linearGradient>
  <symbol id="folder" viewBox="0 0 64 64">
    <path d="M5 13a4 4 0 0 1 4-4h14.2a4 4 0 0 1 2.9 1.2l3.7 3.8H55a4 4 0 0 1 4 4v8H5z" fill="url(#fg1)"/>
    <path d="M3 22.5a3.5 3.5 0 0 1 3.5-3.5h51A3.5 3.5 0 0 1 61 22.5V50a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4z" fill="url(#fg2)"/>
  </symbol></defs></svg>
<div class="app" id="app">
  <div class="tabs"><div class="tab"><svg><use href="#folder"/></svg><span id="tabTitle">Home</span></div></div>
  <div class="row top">
    <button class="btn burger" id="burger" title="Menu"><i class="fa-solid fa-bars"></i></button>
    <button class="btn" id="back" title="Back"><i class="fa-solid fa-arrow-left"></i></button>
    <button class="btn" id="fwd" title="Forward"><i class="fa-solid fa-arrow-right"></i></button>
    <button class="btn" id="up" title="Up"><i class="fa-solid fa-arrow-up"></i></button>
    <button class="btn" id="refresh" title="Refresh"><i class="fa-solid fa-rotate-right"></i></button>
    <div class="addr row"><svg width="16" height="16"><use href="#folder"/></svg><div class="crumbs" id="crumbs"></div></div>
    <div class="search"><input id="q" type="search" placeholder="Search" autocomplete="off"><i class="fa-solid fa-magnifying-glass"></i></div>
  </div>
  <div class="row cmd">
    <button class="btn" id="newFolder"><i class="fa-solid fa-folder-plus" style="color:#e9a826"></i> New folder</button>
    <span class="sep"></span>
    <button class="btn" id="sortBtn"><i class="fa-solid fa-arrow-up-wide-short"></i> <span id="sortLbl">Sort</span></button>
    <button class="btn" id="viewBtn"><i class="fa-solid fa-table-cells-large" id="viewIc"></i> <span>View</span></button>
    <span class="sep"></span>
    <select id="fKind" title="Filter by type"><option value="">All types</option></select>
    <select id="fChan" title="Filter by source channel"><option value="">All channels</option></select>
    <span class="sep"></span>
    <button class="btn" id="syncBtn" title="Index new files from your Telegram channels"><i class="fa-solid fa-arrows-rotate"></i> <span>Sync</span></button>
    <button class="btn" id="vlcBtn" title="One-time setup so double-click opens VLC"><i class="fa-solid fa-circle-play" style="color:#f77f00"></i> VLC setup</button>
    <span style="flex:1"></span>
    <button class="btn" id="detBtn" title="Details pane"><i class="fa-solid fa-table-columns"></i> Details</button>
    <button class="btn" id="themeBtn" title="Light / dark"><i class="fa-solid fa-circle-half-stroke"></i></button>
    <a class="btn" href="/" title="Back to admin dashboard"><i class="fa-solid fa-gauge"></i> Admin</a>
  </div>
  <div class="main">
    <aside class="nav" id="nav"></aside>
    <section class="content" id="content" tabindex="0"></section>
    <aside class="details" id="details"></aside>
  </div>
  <div class="status"><span id="stCount"></span><span id="stSel"></span><span style="flex:1"></span><span id="stSync"></span>
    <button class="btn" id="stDet" title="Details pane"><i class="fa-solid fa-table-columns"></i></button>
    <button class="btn" id="stList" title="Details view"><i class="fa-solid fa-list"></i></button>
    <button class="btn" id="stGrid" title="Large icons"><i class="fa-solid fa-table-cells-large"></i></button></div>
</div>

<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const enc = encodeURIComponent;
const KINDS = [['video','Videos','fa-film','#8764b8'],['audio','Audio','fa-music','#e3008c'],['image','Images','fa-image','#0f7b0f'],['document','Documents','fa-file-lines','#2b579a'],['archive','Archives','fa-file-zipper','#d29200'],['subtitle','Subtitles','fa-closed-captioning','#00a3ad'],['other','Other','fa-file','#7a7574']];
const KICON = Object.fromEntries(KINDS.map(k => [k[0], k[2]]));
const KNAME = Object.fromEntries(KINDS.map(k => [k[0], k[1]]));
const KCOLOR = Object.fromEntries(KINDS.map(k => [k[0], k[3]]));
const FOLDER = (cls = 'ic') => `<svg class="${cls}"><use href="#folder"/></svg>`;
const PAGE = 60;
const isMedia = it => it.kind === 'video' || it.kind === 'audio';

// ---------- state ----------
const S = {
  view: {t: 'home'},
  items: [], total: 0, page: 0, loading: false, done: false,
  sort: localStorage.getItem('ex.sort') || 'date', order: localStorage.getItem('ex.order') || 'desc',
  mode: localStorage.getItem('ex.mode') || 'grid',
  q: '', kind: '', chan: '',
  sel: new Set(), last: null,
  sum: null, folders: [], expanded: new Set(JSON.parse(localStorage.getItem('ex.exp') || '[]')),
  detOpen: localStorage.getItem('ex.det') === '1', gen: 0, syncPoll: null
};

// ---------- api ----------
async function api(url, opt = {}) {
  const o = Object.assign({credentials: 'same-origin'}, opt);
  if (o.body && typeof o.body !== 'string') { o.body = JSON.stringify(o.body); o.headers = Object.assign({'Content-Type': 'application/json'}, o.headers); }
  const r = await fetch(url, o);
  if (r.redirected && r.url.includes('/login')) { location.href = '/login'; throw new Error('Session expired'); }
  if (!r.ok) { let m = r.statusText; try { const j = await r.json(); m = j.detail || j.error || m; } catch (e) {} const err = new Error(m); err.status = r.status; throw err; }
  return r.json();
}
function toast(msg, ms = 2600) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), ms); }
const fmtSize = n => { n = +n || 0; if (!n) return '—'; const u = ['B','KB','MB','GB','TB']; let i = 0; while (n >= 1024 && i < 4) { n /= 1024; i++; } return (i ? n.toFixed(n >= 100 ? 0 : 1) : n) + ' ' + u[i]; };
const fmtDate = s => s ? new Date(s).toLocaleString([], {year:'numeric', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'}) : '—';
const fmtDur = s => { s = Math.max(0, Math.floor(+s || 0)); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60; return (h ? h + ':' + String(m).padStart(2,'0') : m) + ':' + String(x).padStart(2,'0'); };
const byId = id => S.items.find(i => i.id === id);
const tip = i => `${i.name}\nType: ${i.ext ? i.ext.toUpperCase() + ' file' : KNAME[i.kind]}\nSize: ${fmtSize(i.size)}\nDate: ${fmtDate(i.date)}\nChannel: ${i.channel}`;

// ---------- theme ----------
function applyTheme() {
  const pref = localStorage.getItem('ex.theme') || 'auto';
  const dark = pref === 'dark' || (pref === 'auto' && (document.documentElement.dataset.serverDark === '1' || matchMedia('(prefers-color-scheme: dark)').matches));
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
}
$('#themeBtn').onclick = () => { localStorage.setItem('ex.theme', document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'); applyTheme(); };
applyTheme();

// ---------- URL routing: every view/folder has its own /explorer/... URL ----------
const RES = {'home': {t: 'home'}, 'all files': {t: 'all'}, 'favorites': {t: 'fav'}, 'folders': {t: 'folders'}};
KINDS.forEach(([k, n]) => { RES[n.toLowerCase()] = {t: 'kind', k}; });
function folderPath(id) { const out = []; let cur = S.folders.find(f => f.id === id); while (cur) { out.unshift(cur); cur = S.folders.find(f => f.id === cur.parent_id); } return out; }
function viewToPath(v) {
  switch (v.t) {
    case 'all': return '/explorer/All%20Files';
    case 'fav': return '/explorer/Favorites';
    case 'folders': return '/explorer/Folders';
    case 'kind': return '/explorer/' + enc(KNAME[v.k]);
    case 'channel': { const c = (S.sum?.channels || []).find(c => c.chat_id === v.id); return '/explorer/Channels/' + enc(c ? c.name : String(v.id)); }
    case 'folder': { const p = folderPath(v.id); return p.length ? '/explorer/' + p.map(f => enc(f.name)).join('/') : '/explorer'; }
    default: return '/explorer';
  }
}
function pathToView(pathname) {
  const segs = pathname.replace(/^\/explorer\/?/, '').split('/').filter(Boolean).map(s => { try { return decodeURIComponent(s); } catch (e) { return s; } });
  if (!segs.length) return {t: 'home'};
  const k = segs[0].toLowerCase();
  if (k === 'channels') { if (!segs[1]) return {t: 'home'}; const c = (S.sum?.channels || []).find(c => c.name.toLowerCase() === segs[1].toLowerCase() || String(c.chat_id) === segs[1]); return c ? {t: 'channel', id: c.chat_id} : null; }
  if (segs.length === 1 && RES[k]) return RES[k];
  let parent = null, cur = null;
  for (const seg of segs) { cur = S.folders.find(f => (f.parent_id || null) === parent && f.name.toLowerCase() === seg.toLowerCase()); if (!cur) return null; parent = cur.id; }
  return {t: 'folder', id: cur.id};
}
const urlFor = v => viewToPath(v) + (S.q ? '?q=' + enc(S.q) : '');
function syncUrl(replace = true) { const u = urlFor(S.view); if (u !== location.pathname + location.search) history[replace ? 'replaceState' : 'pushState']({}, '', u); document.title = crumbParts().slice(-1)[0][0] + ' - File Explorer'; }
function go(v, push = true) {
  S.view = v; S.sel.clear(); S.last = null;
  if (push) history.pushState({}, '', urlFor(v));
  document.title = crumbParts().slice(-1)[0][0] + ' - File Explorer';
  $('#nav').classList.remove('open');
  renderNav(); load(true);
}
window.addEventListener('popstate', () => {
  const v = pathToView(location.pathname) || {t: 'home'};
  S.q = new URLSearchParams(location.search).get('q') || ''; $('#q').value = S.q;
  go(v, false);
});
// Anchors give real links (middle-click / open in new tab) while normal clicks stay in-page
function link(el, viewFn) {
  el.setAttribute('href', viewToPath(viewFn()));
  el.addEventListener('click', e => { if (e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0) return; e.preventDefault(); S.q = ''; $('#q').value = ''; go(viewFn()); });
}
$('#back').onclick = () => history.back();
$('#fwd').onclick = () => history.forward();
$('#up').onclick = () => {
  const v = S.view;
  if (v.t === 'folder') { const f = S.folders.find(x => x.id === v.id); go(f && f.parent_id ? {t: 'folder', id: f.parent_id} : {t: 'folders'}); }
  else if (v.t !== 'home') go({t: 'home'});
};
$('#refresh').onclick = () => { refreshSummary().then(() => load(true)); };
$('#burger').onclick = () => $('#nav').classList.toggle('open');

function crumbParts() {
  const v = S.view, parts = [['This PC', {t: 'home'}]];
  if (v.t === 'all') parts.push(['All Files', v]);
  else if (v.t === 'kind') parts.push([KNAME[v.k], v]);
  else if (v.t === 'fav') parts.push(['Favorites', v]);
  else if (v.t === 'channel') parts.push([(S.sum?.channels.find(c => c.chat_id === v.id)?.name) || 'Channel', v]);
  else if (v.t === 'folders') parts.push(['Folders', v]);
  else if (v.t === 'folder') { parts.push(['Folders', {t: 'folders'}]); folderPath(v.id).forEach(f => parts.push([f.name, {t: 'folder', id: f.id}])); }
  if (S.q) parts.push(['Search results in ' + parts[parts.length - 1][0], null]);
  if (v.t === 'home' && !S.q) return [['Home', v]];
  return parts;
}
function renderCrumbs() {
  const parts = crumbParts();
  $('#crumbs').innerHTML = parts.map((p, i) => (i ? '<i class="fa-solid fa-chevron-right chev"></i>' : '') + `<span class="crumb" data-i="${i}">${esc(p[0])}</span>`).join('');
  $('#crumbs').querySelectorAll('.crumb').forEach(el => el.onclick = () => { const t = parts[+el.dataset.i][1]; if (t) { S.q = ''; $('#q').value = ''; go(t); } });
  $('#tabTitle').textContent = parts[parts.length - 1][0];
  $('#up').disabled = S.view.t === 'home';
}

// ---------- sidebar ----------
function ni(label, icon, active, attrs = '', count = '', color = '') {
  return `<a class="ni ${active ? 'active' : ''}" ${attrs}><i class="fa-solid ${icon} ic" ${color ? `style="color:${color}"` : ''}></i><span class="t">${esc(label)}</span>${count !== '' ? `<span class="n">${count}</span>` : ''}</a>`;
}
function folderNodes(parent, depth) {
  return S.folders.filter(f => (f.parent_id || null) === parent).map(f => {
    const kids = S.folders.some(x => x.parent_id === f.id), open = S.expanded.has(f.id);
    const active = S.view.t === 'folder' && S.view.id === f.id;
    return `<a class="ni ${active ? 'active' : ''}" data-folder="${f.id}" style="padding-left:${8 + depth * 14}px">
      <span class="tw" data-tw="${f.id}">${kids ? `<i class="fa-solid fa-chevron-${open ? 'down' : 'right'}"></i>` : ''}</span>
      ${FOLDER()}<span class="t">${esc(f.name)}</span><span class="n">${f.count || ''}</span></a>` + (open ? folderNodes(f.id, depth + 1) : '');
  }).join('');
}
function renderNav() {
  const sum = S.sum, v = S.view, k = sum ? sum.kinds : {};
  let h = ni('Home', 'fa-house', v.t === 'home', 'data-go="home"');
  h += ni('All Files', 'fa-layer-group', v.t === 'all', 'data-go="all"', sum ? sum.total : '');
  h += ni('Favorites', 'fa-star', v.t === 'fav', 'data-go="fav"', sum ? sum.favorites : '', '#f5b301');
  h += '<h6>Libraries</h6>';
  KINDS.forEach(([key, name, ic, col]) => { h += ni(name, ic, v.t === 'kind' && v.k === key, `data-kind="${key}"`, k[key] || 0, col); });
  h += `<h6><span>Folders</span><span class="btn" style="height:22px;min-width:22px;padding:0" id="navNew" title="New folder"><i class="fa-solid fa-plus" style="font-size:11px"></i></span></h6>`;
  h += `<a class="ni ${v.t === 'folders' ? 'active' : ''}" data-go="folders">${FOLDER()}<span class="t">All folders</span></a>`;
  h += folderNodes(null, 0);
  if (sum && sum.channels.length) { h += '<h6>Telegram channels</h6>'; sum.channels.forEach(c => { h += ni(c.name, 'fa-paper-plane', v.t === 'channel' && v.id === c.chat_id, `data-chan="${c.chat_id}"`, c.count, '#2aabee'); }); }
  const nav = $('#nav'); nav.innerHTML = h;
  nav.querySelectorAll('[data-go]').forEach(e => link(e, () => ({t: e.dataset.go})));
  nav.querySelectorAll('[data-kind]').forEach(e => link(e, () => ({t: 'kind', k: e.dataset.kind})));
  nav.querySelectorAll('[data-chan]').forEach(e => link(e, () => ({t: 'channel', id: +e.dataset.chan})));
  nav.querySelectorAll('[data-folder]').forEach(e => {
    link(e, () => ({t: 'folder', id: e.dataset.folder}));
    e.oncontextmenu = ev => { ev.preventDefault(); folderMenu(ev, e.dataset.folder); };
    dropTarget(e, () => e.dataset.folder);
  });
  nav.querySelectorAll('[data-tw]').forEach(e => e.onclick = ev => { ev.preventDefault(); ev.stopPropagation(); const id = e.dataset.tw; S.expanded.has(id) ? S.expanded.delete(id) : S.expanded.add(id); localStorage.setItem('ex.exp', JSON.stringify([...S.expanded])); renderNav(); });
  const nn = $('#navNew'); if (nn) nn.onclick = () => newFolder(S.view.t === 'folder' ? S.view.id : null);
  const fd = nav.querySelector('[data-go="folders"]'); if (fd) dropTarget(fd, () => '');
  renderCrumbs();
  const fk = $('#fKind'); if (fk.options.length <= 1) KINDS.forEach(([key, name]) => fk.add(new Option(name, key)));
  const fc = $('#fChan'); const cur = fc.value; fc.length = 1; (sum?.channels || []).forEach(c => fc.add(new Option(c.name, c.chat_id))); fc.value = cur;
}

// ---------- drag & drop (move references between virtual folders) ----------
function dropTarget(el, getFolder) {
  el.addEventListener('dragover', e => { if (e.dataTransfer.types.includes('text/x-explorer')) { e.preventDefault(); el.classList.add('drop'); } });
  el.addEventListener('dragleave', () => el.classList.remove('drop'));
  el.addEventListener('drop', async e => {
    el.classList.remove('drop'); const raw = e.dataTransfer.getData('text/x-explorer'); if (!raw) return; e.preventDefault();
    await moveFiles(JSON.parse(raw), getFolder() || null);
  });
}
function dragStart(e, id) {
  if (!S.sel.has(id)) { S.sel = new Set([id]); paintSel(); }
  e.dataTransfer.setData('text/x-explorer', JSON.stringify([...S.sel])); e.dataTransfer.effectAllowed = 'move';
}
async function moveFiles(ids, folderId) {
  try { const r = await api('/api/explorer/move', {method: 'POST', body: {file_ids: ids, folder_id: folderId}}); toast(`Moved ${r.moved} reference${r.moved === 1 ? '' : 's'} (Telegram files untouched)`); await refreshSummary(); load(true); }
  catch (e) { toast(e.message); }
}

// ---------- data loading ----------
async function refreshSummary() {
  try {
    S.sum = await api('/api/explorer/summary'); S.folders = S.sum.folders;
    if (S.view.t === 'folder' && !S.folders.find(f => f.id === S.view.id)) { go({t: 'folders'}); return; }
    renderNav(); syncUrl(true); updateSyncUI(S.sum.status); if (S.sum.status.running) pollSync();
  } catch (e) { toast(e.message); }
}
function queryFor(page) {
  const v = S.view, p = new URLSearchParams({sort: S.sort, order: S.order, page, limit: PAGE});
  if (v.t === 'kind') p.set('kind', v.k);
  if (v.t === 'fav') p.set('fav', 'true');
  if (v.t === 'folder') p.set('folder', v.id);
  if (v.t === 'channel') p.set('channel', v.id);
  if (S.kind && v.t !== 'kind') p.set('kind', S.kind);
  if (S.chan && v.t !== 'channel') p.set('channel', S.chan);
  if (S.q) p.set('q', S.q);
  return p.toString();
}
function subfolders() {
  const v = S.view; if (S.q) return [];
  if (v.t === 'folders') return S.folders.filter(f => !f.parent_id);
  if (v.t === 'folder') return S.folders.filter(f => f.parent_id === v.id);
  return [];
}
async function load(reset) {
  const gen = ++S.gen;
  if (reset) { S.items = []; S.total = 0; S.page = 0; S.done = false; S.loading = false; }
  renderCrumbs();
  if (S.view.t === 'home' && !S.q) return renderHome();
  if (S.view.t === 'folders' && !S.q) { S.done = true; return render(); }
  if (S.loading || S.done) return;
  S.loading = true;
  try {
    const r = await api('/api/explorer/files?' + queryFor(S.page + 1));
    if (gen !== S.gen) return;
    S.page = r.page; S.total = r.total; S.items = S.items.concat(r.items); S.done = S.items.length >= r.total;
  } catch (e) { if (gen === S.gen) toast(e.message); }
  S.loading = false; if (gen === S.gen) render();
}

// ---------- rendering ----------
const iconFor = i => KICON[i.kind] || 'fa-file';
function thumbHtml(i) {
  const dur = i.kind === 'video' && i.duration ? `<span class="badge">${fmtDur(i.duration)}</span>` : '';
  const img = i.has_thumb ? `<img loading="lazy" src="/_ex/thumb/${i.id}" onerror="this.remove();this.parentNode&&this.parentNode.classList.remove('has')">` : '';
  return `<div class="thumb ${i.has_thumb ? 'has' : ''}"><i class="fa-solid ${iconFor(i)} big" style="color:${KCOLOR[i.kind] || '#777'}"></i>${img}${dur}</div>`;
}
function renderHome() {
  const c = $('#content');
  if (!S.sum) { c.innerHTML = '<div class="empty"><div class="spin" style="border-color:var(--line);border-top-color:var(--accent)"></div></div>'; return; }
  if (!S.sum.total) { c.innerHTML = emptyIndex(); bindEmpty(); counts(); return; }
  c.innerHTML = '<div class="pad" id="homePad"></div>';
  const pad = $('#homePad');
  const chs = S.sum.channels.map(ch => `<a class="chcard" data-chan="${ch.chat_id}"><i class="fa-brands fa-telegram"></i><div style="min-width:0"><div class="t" style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(ch.name)}</div><div style="color:var(--muted);font-size:12px">${ch.count} files · ${fmtSize(ch.size)}</div></div></a>`).join('');
  const quick = KINDS.filter(k => (S.sum.kinds[k[0]] || 0) > 0).map(k => `<a class="chcard" data-kind="${k[0]}"><i class="fa-solid ${k[2]}" style="color:${k[3]}"></i><div><div style="font-weight:600">${k[1]}</div><div style="color:var(--muted);font-size:12px">${S.sum.kinds[k[0]]} files</div></div></a>`).join('');
  const fl = S.folders.filter(f => !f.parent_id).map(folderTile).join('');
  pad.innerHTML = `<div class="sec">Quick access</div><div class="chcards">${quick}</div>
    ${chs ? `<div class="sec">Telegram channels</div><div class="chcards">${chs}</div>` : ''}
    ${fl ? `<div class="sec">Folders</div><div class="grid" style="margin-bottom:20px">${fl}</div>` : ''}
    <div class="sec">Recent <small>newest first</small></div><div class="grid" id="recent"></div>
    <div class="sec" id="favSec" style="margin-top:20px;display:none">Favorites</div><div class="grid" id="favs"></div>`;
  pad.querySelectorAll('[data-chan]').forEach(e => link(e, () => ({t: 'channel', id: +e.dataset.chan})));
  pad.querySelectorAll('[data-kind]').forEach(e => link(e, () => ({t: 'kind', k: e.dataset.kind})));
  bindFolderTiles(pad);
  const gen = S.gen;
  api('/api/explorer/files?sort=date&order=desc&limit=12').then(r => { if (gen !== S.gen) return; S.items = r.items.slice(); fillGrid($('#recent'), r.items); });
  api('/api/explorer/files?fav=true&limit=12&sort=date&order=desc').then(r => { if (gen !== S.gen || !r.items.length) return; $('#favSec').style.display = ''; S.items = S.items.concat(r.items); fillGrid($('#favs'), r.items); });
  counts();
}
function fillGrid(el, items) { el.innerHTML = items.map(cardHtml).join(''); bindItems(el); }
function folderTile(f) { return `<a class="card folder-tile" data-folder="${f.id}" title="${esc(f.name)}\n${f.count} item${f.count === 1 ? '' : 's'}"><div class="thumb">${FOLDER('fold')}</div><div class="nm">${esc(f.name)}</div></a>`; }
function bindFolderTiles(root) {
  root.querySelectorAll('.folder-tile').forEach(e => {
    e.setAttribute('href', viewToPath({t: 'folder', id: e.dataset.folder}));
    e.addEventListener('click', ev => { ev.preventDefault(); if (matchMedia('(pointer:coarse)').matches) go({t: 'folder', id: e.dataset.folder}); else { document.querySelectorAll('.card.sel,tr.sel').forEach(x => x.classList.remove('sel')); e.classList.add('sel'); } });
    e.ondblclick = () => go({t: 'folder', id: e.dataset.folder});
    e.oncontextmenu = ev => { ev.preventDefault(); folderMenu(ev, e.dataset.folder); };
    dropTarget(e, () => e.dataset.folder);
  });
}
function cardHtml(i) {
  return `<div class="card ${S.sel.has(i.id) ? 'sel' : ''}" data-id="${i.id}" draggable="true" title="${esc(tip(i))}">${i.favorite ? '<i class="fa-solid fa-star star"></i>' : ''}${thumbHtml(i)}<div class="nm">${esc(i.name)}</div></div>`;
}
function rowHtml(i) {
  return `<tr class="fr ${S.sel.has(i.id) ? 'sel' : ''}" data-id="${i.id}" draggable="true" title="${esc(tip(i))}"><td class="name"><i class="fa-solid ${iconFor(i)} ic" style="color:${KCOLOR[i.kind] || '#777'}"></i>${esc(i.name)}${i.favorite ? ' <i class="fa-solid fa-star" style="color:#f5b301;font-size:11px"></i>' : ''}</td><td class="hm">${fmtDate(i.date)}</td><td class="hm">${esc(i.ext ? i.ext.toUpperCase() + ' file' : KNAME[i.kind])}</td><td class="sz">${fmtSize(i.size)}</td><td class="hm">${esc(i.channel)}</td></tr>`;
}
function render() {
  const c = $('#content'), folders = subfolders();
  if (S.view.t === 'home' && !S.q) return renderHome();
  if (!S.items.length && !folders.length && !S.loading) {
    c.innerHTML = S.sum && !S.sum.total && !S.q ? emptyIndex() : `<div class="empty"><i class="fa-solid ${S.q ? 'fa-magnifying-glass' : 'fa-folder-open'}"></i><div>${S.q ? 'No items match your search.' : (S.view.t === 'folder' || S.view.t === 'folders' ? 'This folder is empty' : 'Nothing here yet')}</div></div>`;
    bindEmpty(); counts(); return;
  }
  let h = '<div class="pad">';
  if (S.mode === 'grid') {
    h += `<div class="grid" id="items">${folders.map(folderTile).join('')}${S.items.map(cardHtml).join('')}</div>`;
  } else {
    const th = (k, l, cls = '') => `<th class="${cls}" data-sort="${k}">${l}${S.sort === k ? ` <i class="fa-solid fa-chevron-${S.order === 'asc' ? 'up' : 'down'}" style="font-size:8px"></i>` : ''}</th>`;
    h += `<table><thead><tr>${th('name', 'Name')}${th('date', 'Date modified', 'hm')}${th('type', 'Type', 'hm')}${th('size', 'Size')}<th class="hm">Source channel</th></tr></thead><tbody id="items">${folders.map(f => `<tr class="fr folder-tile" data-folder="${f.id}"><td class="name">${FOLDER()}${esc(f.name)}</td><td class="hm">—</td><td class="hm">File folder</td><td class="sz"></td><td class="hm"></td></tr>`).join('')}${S.items.map(rowHtml).join('')}</tbody></table>`;
  }
  h += `<div id="more" style="padding:16px;text-align:center;color:var(--muted)">${S.done ? '' : (S.loading ? 'Loading…' : '<button class="btn" id="moreBtn">Load more</button>')}</div></div>`;
  const st = c.scrollTop; c.innerHTML = h; c.scrollTop = st;
  bindItems(c); bindFolderTiles(c);
  c.querySelectorAll('th[data-sort]').forEach(t => t.onclick = () => setSort(t.dataset.sort));
  const mb = $('#moreBtn'); if (mb) mb.onclick = () => load();
  counts();
}
function emptyIndex() {
  const running = S.sum && S.sum.status.running;
  return `<div class="empty"><i class="fa-brands fa-telegram"></i><div style="font-size:16px;color:var(--text)">${running ? 'Indexing your Telegram channels…' : 'No files indexed yet'}</div><div>${running ? 'Files appear here as soon as they are found.' : 'Index your Telegram channels once and the Explorer keeps itself up to date.'}</div>${running ? '' : '<button class="btn primary" id="emptySync"><i class="fa-solid fa-arrows-rotate"></i> Index my channels</button>'}${S.sum && !S.sum.configured_channels.length ? '<div>No channels configured — add AUTH_CHANNEL in Settings first.</div>' : ''}</div>`;
}
function bindEmpty() { const b = $('#emptySync'); if (b) b.onclick = () => startSync(false); }
function counts() {
  const v = S.view;
  $('#stCount').textContent = v.t === 'home' ? `${S.sum ? S.sum.total : 0} items` : `${S.items.length + subfolders().length}${S.total > S.items.length ? ' of ' + S.total : ''} item${S.total === 1 ? '' : 's'}`;
  const n = S.sel.size; const sz = [...S.sel].reduce((a, id) => a + ((byId(id) || {}).size || 0), 0);
  $('#stSel').textContent = n ? `|   ${n} item${n > 1 ? 's' : ''} selected   ${sz ? fmtSize(sz) : ''}` : '';
  $('#stGrid').classList.toggle('active', S.mode === 'grid'); $('#stList').classList.toggle('active', S.mode === 'list');
  renderDetails();
}
$('#content').addEventListener('scroll', e => { const c = e.target; if (!S.done && !S.loading && c.scrollTop + c.clientHeight > c.scrollHeight - 500) load(); });

// ---------- selection / interaction ----------
function paintSel() { document.querySelectorAll('[data-id]').forEach(e => e.classList.toggle('sel', S.sel.has(e.dataset.id))); counts(); }
function bindItems(root) {
  root.querySelectorAll('[data-id]').forEach(e => {
    const id = e.dataset.id;
    e.onclick = ev => {
      document.querySelectorAll('.folder-tile.sel').forEach(x => x.classList.remove('sel'));
      if (ev.ctrlKey || ev.metaKey) { S.sel.has(id) ? S.sel.delete(id) : S.sel.add(id); }
      else if (ev.shiftKey && S.last) { const ids = S.items.map(x => x.id), a = ids.indexOf(S.last), b = ids.indexOf(id); S.sel = new Set(ids.slice(Math.min(a, b), Math.max(a, b) + 1)); }
      else { S.sel = new Set([id]); if (matchMedia('(pointer:coarse)').matches) { openItem(id); return; } }
      S.last = id; paintSel();
    };
    e.ondblclick = () => openItem(id);          // double-click = open (videos/audio go straight to VLC)
    e.oncontextmenu = ev => { ev.preventDefault(); if (!S.sel.has(id)) { S.sel = new Set([id]); paintSel(); } fileMenu(ev, id); };
    e.ondragstart = ev => dragStart(ev, id);
  });
}
$('#content').addEventListener('click', e => { if (e.target.id === 'content' || e.target.classList.contains('pad')) { S.sel.clear(); paintSel(); } });
document.addEventListener('keydown', e => {
  if (e.target.matches('input,select,textarea') || document.querySelector('.viewer,.scrim')) return;
  if (e.key === 'Enter' && S.sel.size === 1) openItem([...S.sel][0]);
  if ((e.ctrlKey || e.metaKey) && e.key === 'a') { e.preventDefault(); S.sel = new Set(S.items.map(i => i.id)); paintSel(); }
  if (e.key === 'Escape') { S.sel.clear(); paintSel(); closeMenu(); }
  if (e.key === 'Backspace') { e.preventDefault(); $('#up').click(); }
  if (e.key === '/' || ((e.ctrlKey || e.metaKey) && e.key === 'f')) { e.preventDefault(); $('#q').focus(); }
  if (e.altKey && e.key === 'ArrowLeft') history.back();
});

// ---------- menus ----------
function closeMenu() { document.querySelectorAll('.menu').forEach(m => m.remove()); }
document.addEventListener('click', closeMenu); window.addEventListener('blur', closeMenu);
function showMenu(ev, entries) {
  closeMenu();
  const m = document.createElement('div'); m.className = 'menu';
  m.innerHTML = entries.map((x, i) => x === '-' ? '<hr>' : `<div class="mi" data-i="${i}"><i class="fa-solid ${x.icon || 'fa-circle'}"></i>${esc(x.label)}</div>`).join('');
  document.body.appendChild(m);
  const w = m.offsetWidth, h = m.offsetHeight;
  m.style.left = Math.max(4, Math.min(ev.clientX, innerWidth - w - 8)) + 'px'; m.style.top = Math.max(4, Math.min(ev.clientY, innerHeight - h - 8)) + 'px';
  m.querySelectorAll('.mi').forEach(el => el.onclick = e => { e.stopPropagation(); closeMenu(); entries[+el.dataset.i].fn(); });
}
function fileMenu(ev, id) {
  const it = byId(id); if (!it) return; const ids = [...S.sel], multi = ids.length > 1;
  const e = [];
  if (!multi) e.push({label: isMedia(it) ? 'Play in VLC' : 'Open', icon: isMedia(it) ? 'fa-play' : 'fa-up-right-from-square', fn: () => openItem(id)});
  if (!multi && !isMedia(it)) e.push({label: 'Download', icon: 'fa-download', fn: () => download(it)});
  if (!multi) e.push({label: 'Copy stream link', icon: 'fa-link', fn: () => copyLink(it)});
  if (e.length) e.push('-');
  e.push({label: it.favorite ? 'Remove from Favorites' : 'Add to Favorites', icon: 'fa-star', fn: () => favorite(ids, !it.favorite)},
    {label: 'Move to folder…', icon: 'fa-folder-open', fn: () => moveDialog(ids)});
  if (it.folder_id) e.push({label: 'Remove from folder', icon: 'fa-folder-minus', fn: () => moveFiles(ids, null)});
  if (!multi) e.push('-', {label: 'Properties', icon: 'fa-circle-info', fn: () => { S.detOpen = true; localStorage.setItem('ex.det', '1'); renderDetails(); }});
  showMenu(ev, e);
}
function folderMenu(ev, id) {
  showMenu(ev, [{label: 'Open', icon: 'fa-folder-open', fn: () => go({t: 'folder', id})},
    {label: 'Copy folder link', icon: 'fa-link', fn: () => { const u = location.origin + viewToPath({t: 'folder', id}); (navigator.clipboard ? navigator.clipboard.writeText(u) : Promise.reject()).then(() => toast('Folder link copied'), () => prompt('Folder link', u)); }},
    {label: 'New subfolder', icon: 'fa-folder-plus', fn: () => newFolder(id)},
    {label: 'Rename', icon: 'fa-pen', fn: () => renameFolder(id)}, '-',
    {label: 'Delete folder', icon: 'fa-trash', fn: () => deleteFolder(id)}]);
}

// ---------- dialogs ----------
function dialog({title, body = '', ok = 'OK', cancel = 'Cancel', input = null, danger = false}) {
  return new Promise(res => {
    const s = document.createElement('div'); s.className = 'scrim';
    s.innerHTML = `<div class="dlg"><h4>${esc(title)}</h4>${body}${input !== null ? `<input type="text" id="dlgIn" value="${esc(input)}" maxlength="120">` : ''}<div class="ft">${cancel ? `<button class="btn" id="dlgNo">${esc(cancel)}</button>` : ''}<button class="btn primary" id="dlgOk" ${danger ? 'style="background:#d13438;border-color:#d13438;color:#fff"' : ''}>${esc(ok)}</button></div></div>`;
    document.body.appendChild(s);
    const done = v => { s.remove(); res(v); };
    const inp = $('#dlgIn', s); if (inp) { inp.focus(); inp.select(); inp.onkeydown = e => { if (e.key === 'Enter') done(inp.value); if (e.key === 'Escape') done(null); }; }
    $('#dlgOk', s).onclick = () => done(inp ? inp.value : true);
    const no = $('#dlgNo', s); if (no) no.onclick = () => done(null);
    s.onclick = e => { if (e.target === s) done(null); };
  });
}
async function newFolder(parent) {
  const name = await dialog({title: 'New folder', input: 'New folder', ok: 'Create'});
  if (!name) return;
  try { const f = await api('/api/explorer/folders', {method: 'POST', body: {name, parent_id: parent || null}}); if (parent) { S.expanded.add(parent); localStorage.setItem('ex.exp', JSON.stringify([...S.expanded])); } await refreshSummary(); toast(`Created “${f.name}”`); load(true); }
  catch (e) { toast(e.message, 4000); }
}
async function renameFolder(id) {
  const f = S.folders.find(x => x.id === id); const name = await dialog({title: 'Rename folder', input: f ? f.name : '', ok: 'Rename'});
  if (!name) return;
  try { await api('/api/explorer/folders/' + id, {method: 'PATCH', body: {name}}); await refreshSummary(); load(true); } catch (e) { toast(e.message, 4000); }
}
async function deleteFolder(id) {
  const f = S.folders.find(x => x.id === id);
  const ok = await dialog({title: 'Delete folder?', body: `<p>“${esc(f ? f.name : '')}” will be removed. Its files and subfolders move up one level. <b>Nothing is deleted from Telegram.</b></p>`, ok: 'Delete', danger: true});
  if (!ok) return;
  try { await api('/api/explorer/folders/' + id, {method: 'DELETE'}); if (S.view.t === 'folder' && S.view.id === id) go({t: 'folders'}); else { await refreshSummary(); load(true); } } catch (e) { toast(e.message); }
}
async function moveDialog(ids) {
  const tree = (p, d) => S.folders.filter(f => (f.parent_id || null) === p).map(f => `<div class="ni" data-pick="${f.id}" style="padding-left:${10 + d * 16}px">${FOLDER()}<span class="t">${esc(f.name)}</span></div>` + tree(f.id, d + 1)).join('');
  const s = document.createElement('div'); s.className = 'scrim';
  s.innerHTML = `<div class="dlg"><h4>Move ${ids.length} item${ids.length > 1 ? 's' : ''} to…</h4><p>Only the reference moves; the Telegram file stays where it is.</p><div style="max-height:40vh;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:4px">${tree(null, 0) || '<p style="padding:8px">No folders yet.</p>'}</div><div class="ft"><button class="btn" id="mvNew"><i class="fa-solid fa-folder-plus"></i> New folder</button><button class="btn" id="mvNo">Cancel</button></div></div>`;
  document.body.appendChild(s);
  s.querySelectorAll('[data-pick]').forEach(e => e.onclick = () => { s.remove(); moveFiles(ids, e.dataset.pick); });
  $('#mvNo', s).onclick = () => s.remove(); s.onclick = e => { if (e.target === s) s.remove(); };
  $('#mvNew', s).onclick = async () => { s.remove(); const name = await dialog({title: 'New folder', input: 'New folder', ok: 'Create & move'}); if (!name) return; try { const f = await api('/api/explorer/folders', {method: 'POST', body: {name}}); await moveFiles(ids, f.id); } catch (e) { toast(e.message, 4000); } };
}
async function favorite(ids, value) { try { await api('/api/explorer/favorite', {method: 'POST', body: {file_ids: ids, value}}); ids.forEach(id => { const it = byId(id); if (it) it.favorite = value; }); await refreshSummary(); if (S.view.t === 'fav') load(true); else render(); } catch (e) { toast(e.message); } }

// ---------- links ----------
const links = it => api('/api/explorer/links/' + it.id);
async function download(it) {                       // documents / images / archives only - never video or audio
  if (isMedia(it)) return;
  try { const l = await links(it); if (!l.download) return; const a = document.createElement('a'); a.href = l.download; a.download = it.name; document.body.appendChild(a); a.click(); a.remove(); } catch (e) { toast(e.message); }
}
async function copyLink(it) {
  try { const l = await links(it); await (navigator.clipboard ? navigator.clipboard.writeText(l.stream) : Promise.reject()); toast('Stream link copied'); }
  catch (e) { const l = await links(it).catch(() => null); if (l) dialog({title: 'Stream link', body: `<input type="text" readonly value="${esc(l.stream)}" onclick="this.select()">`, ok: 'Close', cancel: ''}); }
}

// ---------- VLC: double-click opens VLC directly, nothing else is shown ----------
function launchUri(uri) { const a = document.createElement('a'); a.href = uri; a.style.display = 'none'; document.body.appendChild(a); a.click(); a.remove(); }
async function playVlc(it) {
  let l; try { l = await links(it); } catch (e) { return toast(e.message, 4000); }
  if (!localStorage.getItem('ex.vlcReady')) return vlcSetup(l, it);     // only the very first time on this browser
  launchUri(l.vlc_uri);
}
function vlcSetup(l, it) {
  const dflt = (S.sum && S.sum.default_vlc_path) || 'C:\\Program Files\\VideoLAN\\VLC\\vlc.exe';
  const s = document.createElement('div'); s.className = 'scrim'; s.style.zIndex = 95;
  s.innerHTML = `<div class="dlg"><h4>One-time setup: open videos in VLC</h4>
    <p>A web page can only start VLC after Windows is told how. Do this <b>once</b> on this PC (VLC must be installed):</p>
    <ol><li>Download and open this file, then click <b>Yes</b> / <b>OK</b>:<br><a class="btn" id="regLink" href="/_ex/vlc-setup.reg" style="border:1px solid var(--line);margin-top:6px"><i class="fa-brands fa-windows"></i> vlc-setup.reg</a></li>
    <li>Come back and press <b>Done</b>. If the browser asks “Open VLC?”, tick <b>Always allow</b>.</li></ol>
    <p>After that, double-clicking a video opens VLC straight away — no windows, no questions.</p>
    <p style="font-size:12px">VLC installed somewhere else? <input type="text" id="vlcPath" value="${esc(dflt)}"></p>
    <div class="ft"><button class="btn" id="vNo">Cancel</button><button class="btn primary" id="vOk">${l ? 'Done — play now' : 'Done'}</button></div></div>`;
  document.body.appendChild(s);
  const path = $('#vlcPath', s), reg = $('#regLink', s);
  path.oninput = () => { reg.href = '/_ex/vlc-setup.reg?path=' + enc(path.value.trim()); };
  $('#vNo', s).onclick = () => s.remove(); s.onclick = e => { if (e.target === s) s.remove(); };
  $('#vOk', s).onclick = () => { localStorage.setItem('ex.vlcReady', '1'); s.remove(); if (l) launchUri(l.vlc_uri); else toast('VLC setup saved'); };
}
$('#vlcBtn').onclick = () => vlcSetup(null, null);

// ---------- details pane ----------
function renderDetails() {
  const d = $('#details'); d.classList.toggle('open', S.detOpen); $('#detBtn').classList.toggle('active', S.detOpen); $('#stDet').classList.toggle('active', S.detOpen);
  if (!S.detOpen) return;
  if (S.sel.size !== 1) { d.innerHTML = `<div class="empty" style="padding:30px 6px"><i class="fa-solid fa-circle-info"></i><div>${S.sel.size ? S.sel.size + ' items selected' : 'Select a single file to view its details'}</div></div>`; return; }
  const it = byId([...S.sel][0]); if (!it) return;
  const fp = it.folder_id ? folderPath(it.folder_id).map(f => f.name).join(' \\ ') : '—';
  d.innerHTML = `<div class="pv">${it.has_thumb ? `<img src="/_ex/thumb/${it.id}" onerror="this.replaceWith(Object.assign(document.createElement('i'),{className:'fa-solid ${iconFor(it)}'}))">` : `<i class="fa-solid ${iconFor(it)}" style="color:${KCOLOR[it.kind]}"></i>`}</div>
    <h3>${esc(it.name)}</h3>
    <div class="acts"><button class="btn primary" data-a="open"><i class="fa-solid ${isMedia(it) ? 'fa-play' : 'fa-up-right-from-square'}"></i> ${isMedia(it) ? 'Play in VLC' : 'Open'}</button>
      ${isMedia(it) ? '' : '<button class="btn" data-a="dl" title="Download"><i class="fa-solid fa-download"></i></button>'}<button class="btn" data-a="link" title="Copy stream link"><i class="fa-solid fa-link"></i></button>
      <button class="btn" data-a="fav" title="Favorite"><i class="fa-${it.favorite ? 'solid' : 'regular'} fa-star" style="color:#f5b301"></i></button></div>
    <div class="kv"><div>Name</div><div>${esc(it.name)}</div><div>Type</div><div>${esc(KNAME[it.kind])}${it.mime ? ' · ' + esc(it.mime) : ''}</div><div>Extension</div><div>${esc(it.ext || '—')}</div><div>Size</div><div>${fmtSize(it.size)} (${(+it.size).toLocaleString()} bytes)</div>
      <div>Date</div><div>${fmtDate(it.date)}</div>${it.duration ? `<div>Length</div><div>${fmtDur(it.duration)}</div>` : ''}${it.width ? `<div>Dimensions</div><div>${it.width} × ${it.height}</div>` : ''}
      <div>Source channel</div><div>${esc(it.channel)}</div><div>Message</div><div>#${it.msg_id}</div><div>Folder</div><div>${esc(fp)}</div>${it.caption ? `<div>Caption</div><div>${esc(it.caption)}</div>` : ''}</div>`;
  d.querySelectorAll('[data-a]').forEach(b => b.onclick = () => ({open: () => openItem(it.id), dl: () => download(it), link: () => copyLink(it), fav: () => favorite([it.id], !it.favorite)})[b.dataset.a]());
}
const toggleDetails = () => { S.detOpen = !S.detOpen; localStorage.setItem('ex.det', S.detOpen ? '1' : '0'); renderDetails(); };
$('#detBtn').onclick = toggleDetails; $('#stDet').onclick = toggleDetails;

// ---------- toolbar ----------
const SORTS = [['name', 'Name'], ['date', 'Date modified'], ['size', 'Size'], ['type', 'Type']];
function setSort(k) { if (S.sort === k) S.order = S.order === 'asc' ? 'desc' : 'asc'; else { S.sort = k; S.order = k === 'name' || k === 'type' ? 'asc' : 'desc'; } localStorage.setItem('ex.sort', S.sort); localStorage.setItem('ex.order', S.order); sortLabel(); load(true); }
function sortLabel() { $('#sortLbl').textContent = 'Sort: ' + (SORTS.find(s => s[0] === S.sort) || [])[1] + (S.order === 'asc' ? ' ↑' : ' ↓'); }
$('#sortBtn').onclick = ev => { ev.stopPropagation(); const r = ev.currentTarget.getBoundingClientRect(); showMenu({clientX: r.left, clientY: r.bottom + 4}, [...SORTS.map(([k, l]) => ({label: l, icon: S.sort === k ? 'fa-check' : 'fa-minus', fn: () => setSort(k)})), '-', {label: 'Ascending', icon: S.order === 'asc' ? 'fa-check' : 'fa-minus', fn: () => { S.order = 'asc'; localStorage.setItem('ex.order', 'asc'); sortLabel(); load(true); }}, {label: 'Descending', icon: S.order === 'desc' ? 'fa-check' : 'fa-minus', fn: () => { S.order = 'desc'; localStorage.setItem('ex.order', 'desc'); sortLabel(); load(true); }}]); };
function setMode(m) { S.mode = m; localStorage.setItem('ex.mode', m); viewIcon(); render(); }
function viewIcon() { $('#viewIc').className = 'fa-solid ' + (S.mode === 'grid' ? 'fa-table-cells-large' : 'fa-list'); }
$('#viewBtn').onclick = ev => { ev.stopPropagation(); const r = ev.currentTarget.getBoundingClientRect(); showMenu({clientX: r.left, clientY: r.bottom + 4}, [{label: 'Large icons', icon: S.mode === 'grid' ? 'fa-check' : 'fa-minus', fn: () => setMode('grid')}, {label: 'Details', icon: S.mode === 'list' ? 'fa-check' : 'fa-minus', fn: () => setMode('list')}]); };
$('#stGrid').onclick = () => setMode('grid'); $('#stList').onclick = () => setMode('list');
$('#newFolder').onclick = () => newFolder(S.view.t === 'folder' ? S.view.id : null);
$('#fKind').onchange = e => { S.kind = e.target.value; if (S.view.t === 'home' && S.kind) go({t: 'all'}); else load(true); };
$('#fChan').onchange = e => { S.chan = e.target.value; if (S.view.t === 'home' && S.chan) go({t: 'all'}); else load(true); };
let qt; $('#q').oninput = e => { clearTimeout(qt); qt = setTimeout(() => { S.q = e.target.value.trim(); syncUrl(true); load(true); }, 300); };

// ---------- sync ----------
async function startSync(full) {
  try { const r = await api('/api/explorer/sync', {method: 'POST', body: {full}}); toast(r.message); if (r.ok) pollSync(); }
  catch (e) { toast(e.message); }
}
$('#syncBtn').onclick = async () => {
  if (S.sum && S.sum.status.running) { if (await dialog({title: 'Stop indexing?', ok: 'Stop'})) { await api('/api/explorer/sync/cancel', {method: 'POST'}); } return; }
  const r = await dialog({title: 'Sync Telegram files', body: '<p>Scans your configured channels for new files (resumes where it last stopped). New uploads are also indexed live automatically.</p><p style="font-size:12px">The bot sends and instantly deletes a tiny probe message in each channel to find its newest message ID, same as the admin Scan tool.</p>', ok: 'Sync now'});
  if (r) startSync(false);
};
function updateSyncUI(st) {
  const b = $('#syncBtn'); b.querySelector('span').textContent = st.running ? 'Stop' : 'Sync'; b.querySelector('i').className = 'fa-solid ' + (st.running ? 'fa-stop' : 'fa-arrows-rotate');
  const el = $('#stSync');
  if (st.running) el.innerHTML = `Indexing ${esc(st.current_name || '')} · ${st.counters.indexed} indexed <span class="bar"><i style="width:${st.progress}%"></i></span>`;
  else if (st.state === 'done') el.textContent = `Last sync: ${st.counters.indexed} files indexed, ${st.counters.removed} removed`;
  else if (st.state === 'error') el.textContent = 'Sync error: ' + st.error; else el.textContent = '';
}
function pollSync() {
  if (S.syncPoll) return;
  S.syncPoll = setInterval(async () => {
    try { const st = await api('/api/explorer/sync/status'); S.sum.status = st; updateSyncUI(st);
      if (!st.running) { clearInterval(S.syncPoll); S.syncPoll = null; await refreshSummary(); load(true); if (st.state === 'error') toast(st.error, 6000); }
    } catch (e) {}
  }, 2000);
}

// ---------- open: videos/audio -> VLC; images/pdf/text preview; everything else downloads ----------
function openItem(id) {
  const it = byId(id); if (!it) return;
  if (isMedia(it)) return playVlc(it);
  if (it.kind === 'image') return openStatic(it, `<img src="/_ex/stream/${it.id}/${enc(it.name)}" alt="">`);
  if (it.ext === 'pdf') return openStatic(it, `<iframe src="/_ex/stream/${it.id}/${enc(it.name)}"></iframe>`);
  if (it.kind === 'document' || it.kind === 'subtitle' || it.kind === 'other') return openText(it);
  download(it);
}
let V = null;
function closeViewer() { if (!V) return; document.removeEventListener('keydown', V.key); V.el.remove(); V = null; }
function shell(it, inner) {
  closeViewer();
  const el = document.createElement('div'); el.className = 'viewer';
  el.innerHTML = `<div class="vtop"><button class="btn" id="vClose"><i class="fa-solid fa-arrow-left"></i> Back</button><div class="ttl" title="${esc(it.name)}">${esc(it.name)}</div>
    <button class="btn" id="vFav"><i class="fa-${it.favorite ? 'solid' : 'regular'} fa-star" style="color:#f5b301"></i></button>
    <button class="btn" id="vDl"><i class="fa-solid fa-download"></i> Download</button></div>
    <div class="stage" id="stage">${inner}</div>`;
  document.body.appendChild(el);
  V = {el, it}; V.key = e => { if (e.key === 'Escape' && !document.querySelector('.scrim')) closeViewer(); };
  document.addEventListener('keydown', V.key);
  $('#vClose', el).onclick = closeViewer; $('#vDl', el).onclick = () => download(it);
  $('#vFav', el).onclick = async () => { await favorite([it.id], !it.favorite); $('#vFav', el).innerHTML = `<i class="fa-${it.favorite ? 'solid' : 'regular'} fa-star" style="color:#f5b301"></i>`; };
  return el;
}
function openStatic(it, inner) { shell(it, inner); const img = $('#stage img'); if (img) img.onerror = () => { $('#stage').innerHTML = '<div class="overlay">Could not load this file from Telegram.<button class="btn" id="dl2">Download instead</button></div>'; $('#dl2').onclick = () => download(it); }; }
async function openText(it) {
  shell(it, '<div class="overlay"><div class="spin"></div></div>');
  try { const r = await api('/api/explorer/text/' + it.id); $('#stage').innerHTML = `<pre>${esc(r.text)}${r.truncated ? '\n\n… (preview truncated — download for the full file)' : ''}</pre>`; }
  catch (e) { $('#stage').innerHTML = `<div class="overlay"><div>No inline preview for this file type.</div><button class="btn" id="dl2"><i class="fa-solid fa-download"></i> Download</button></div>`; $('#dl2').onclick = () => download(it); }
}

// ---------- boot ----------
$('#content').addEventListener('contextmenu', e => { if (e.target.closest('[data-id],[data-folder]')) return; e.preventDefault(); showMenu(e, [{label: 'New folder', icon: 'fa-folder-plus', fn: () => newFolder(S.view.t === 'folder' ? S.view.id : null)}, {label: 'Refresh', icon: 'fa-rotate-right', fn: () => $('#refresh').click()}, '-', {label: 'Large icons', icon: 'fa-table-cells-large', fn: () => setMode('grid')}, {label: 'Details', icon: 'fa-list', fn: () => setMode('list')}]); });
sortLabel(); viewIcon(); renderDetails();
(async () => {
  S.q = new URLSearchParams(location.search).get('q') || ''; $('#q').value = S.q;
  try { S.sum = await api('/api/explorer/summary'); S.folders = S.sum.folders; updateSyncUI(S.sum.status); if (S.sum.status.running) pollSync(); } catch (e) { toast(e.message); }
  let v = pathToView(location.pathname);
  if (!v) { toast('That folder was not found'); v = {t: 'home'}; }
  S.view = v; syncUrl(true); renderNav(); load(true);
})();
})();
</script>
