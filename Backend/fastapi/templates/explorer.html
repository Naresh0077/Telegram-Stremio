<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>File Explorer</title>
<style>
:root{--bg:#202020;--rib:#2b2b2b;--line:#3d3d3d;--hov:#2f3b49;--sel:#3a5775;--blue:#1979CA;--nav:#252525;--text:#fff;--muted:#a6a6a6;--hdr:#aab6c6;
 --input:#2b2b2b;--inputline:#484848;--grp:#484848;--menu:#2b2b2b;--btn:#3a3a3a;--btnline:#666;--selline:#99d1ff;--box:#202020;--focus:#7eb4ea;color-scheme:dark}
:root[data-theme="light"]{--bg:#ffffff;--rib:#f5f6f7;--line:#dadbdc;--hov:#e5f3ff;--sel:#cce8ff;--blue:#1979CA;--nav:#ffffff;--text:#000;--muted:#6d6d6d;--hdr:#4c607a;
 --input:#ffffff;--inputline:#abadb3;--grp:#e1e1e1;--menu:#f2f2f2;--btn:#e1e1e1;--btnline:#adadad;--selline:#99d1ff;--box:#ffffff;--focus:#0078d7;color-scheme:light}
*{box-sizing:border-box;border-radius:0!important}
html,body{height:100%;margin:0}
body{background:var(--bg);font:12px 'Segoe UI','Segoe UI Variable',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif;color:var(--text);overflow:hidden}
button,select,input{font:inherit;color:inherit}
button{cursor:default;background:none;border:0}
a{color:inherit;text-decoration:none}
svg{flex:none}
#win{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.fx{display:flex}.ac{align-items:center}.grow{flex:1;min-width:0}.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wc{width:46px;height:32px;display:grid;place-items:center}
.wc:hover{background:#3a3a3a;color:#fff}.wc.x:hover{background:#E81123;color:#fff}
/* ribbon tabs */
#tabs{display:flex;padding:4px 4px 0;user-select:none}
.tab{padding:4px 14px;border:1px solid transparent;border-bottom:0}
.tab:hover{background:var(--hov)}
.tab.on{background:var(--rib);border-color:var(--line);position:relative;top:1px;z-index:2}
.tab.file{background:var(--blue);color:#fff;border-color:var(--blue)}.tab.file:hover{background:#1565a8}
#ribbon{border-top:1px solid var(--line);border-bottom:1px solid var(--line);height:92px;overflow-x:auto;overflow-y:hidden;background:var(--rib);flex:none;display:flex;user-select:none}
.grp{display:flex;flex-direction:column;border-right:1px solid var(--grp);padding:0 4px;flex:none}
.grp .bs{display:flex;flex:1;padding-top:3px}
.grp .gl{text-align:center;color:var(--muted);padding:2px 6px 4px}
.rb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:54px;padding:4px 6px;border:1px solid transparent;white-space:nowrap}
.rb:hover:not(:disabled){background:var(--hov);border-color:var(--selline)}
.rb:active:not(:disabled),.rb.on{background:var(--sel);border-color:var(--selline)}
.rb:disabled{opacity:.38}
.ck{display:flex;align-items:center;gap:6px;padding:1px 8px;white-space:nowrap;line-height:16px}.ck:hover{background:var(--hov)}
.bx{width:13px;height:13px;border:1px solid #bbb;display:grid;place-items:center;background:var(--box)}
.fsel{display:flex;flex-direction:column;justify-content:center;gap:4px;padding:0 8px}
.fsel select{height:22px;background:var(--input);border:1px solid var(--inputline);max-width:170px;outline:0}
.fsel select:hover{border-color:var(--focus)}
/* address row */
#addrrow{display:flex;align-items:center;gap:8px;padding:6px;user-select:none}
#addrL{display:flex;position:relative}
.nb{width:26px;height:26px;display:grid;place-items:center;border:1px solid transparent;flex:none}
.nb:hover:not(:disabled){background:var(--hov);border-color:var(--selline)}.nb:disabled{opacity:.35}
#crumbs{flex:1;min-width:0;height:26px;border:1px solid var(--inputline);display:flex;align-items:center;background:var(--input)}
#crumbs:hover{border-color:var(--focus)}
.cr{padding:2px 5px;white-space:nowrap;height:100%}.cr:hover{background:var(--hov)}
#q{width:100%;height:26px;border:1px solid var(--inputline);padding:0 28px 0 8px;outline:0;background:var(--input);color:var(--text)}
#q:focus,#q:hover{border-color:var(--focus)}
/* panes */
#body{display:flex;flex:1;min-height:0;border-top:1px solid var(--line)}
#nav{width:230px;flex:none;background:var(--nav);border-right:1px solid var(--line);overflow:auto;padding:4px 0;user-select:none}
.nv{display:flex;align-items:center;gap:6px;height:22px;white-space:nowrap;padding-right:8px;cursor:default}
.nv:hover{background:var(--hov)}.nv.sel{background:var(--sel)}.nv.drop,.it.drop{outline:1px dashed var(--selline);outline-offset:-1px;background:var(--hov)}
.ar{width:14px;height:14px;display:grid;place-items:center;flex:none;color:var(--muted)}
#main{flex:1;min-width:0;overflow:auto;background:var(--bg);user-select:none}
#details{width:270px;flex:none;border-left:1px solid var(--line);background:var(--nav);overflow:auto;padding:12px;display:none}
#details.open{display:block}
/* details view */
.row{display:grid;grid-template-columns:minmax(220px,1fr) 150px 150px 90px 150px;align-items:center;height:22px;padding:0 4px;white-space:nowrap}
.row>*{overflow:hidden;text-overflow:ellipsis;padding:0 6px}
.hdc{height:26px;display:flex;align-items:center;border-right:1px solid var(--line);color:var(--hdr);cursor:default}
.hdr{position:sticky;top:0;background:var(--bg);z-index:1}.hdr .row{height:26px}
.hdr .hdc:hover{background:var(--hov)}
.it:hover{background:var(--hov)}.it.sel{background:var(--sel)}
/* large icons: 6 per row */
.tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px;padding:8px;align-content:start}
.tile{padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;word-break:break-word;line-height:1.25;position:relative;min-width:0;border:1px solid transparent}
.tile.sel{border-color:var(--selline)}
.tile span.n{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:100%}
.tile small{color:var(--muted)}
.tb{width:100%;aspect-ratio:16/10;display:grid;place-items:center;position:relative;overflow:hidden}
.tb img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.tb.has{background:#000}.tb.has>svg{display:none}
.tb .bd{position:absolute;right:3px;bottom:3px;background:rgba(0,0,0,.75);color:#fff;font-size:11px;padding:0 5px}
.tile .st{position:absolute;left:8px;top:8px;z-index:2}
.ri{border:1px solid #0078D7;padding:0 2px;font:inherit;outline:0;width:100%;background:var(--box);color:var(--text)}
.sechd{display:flex;align-items:center;gap:8px;margin:10px 10px 2px;color:var(--hdr)}
.sechd::after{content:"";flex:1;border-top:1px solid var(--line)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:2px;padding:4px 8px}
.card{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid transparent}
.card:hover{background:var(--hov);border-color:var(--sel)}
.card small{display:block;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:40px 12px;display:flex;flex-direction:column;align-items:center;gap:10px}
/* details pane */
.dp .pv{aspect-ratio:16/10;background:var(--box);border:1px solid var(--line);display:grid;place-items:center;position:relative;overflow:hidden;margin-bottom:10px}
.dp .pv img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.dp .pv.has{background:#000}.dp .pv.has>svg{display:none}
.dp h3{margin:0 0 8px;font-size:13px;font-weight:600;word-break:break-word}
.kv{display:grid;grid-template-columns:86px 1fr;gap:4px 8px}
.kv div:nth-child(odd){color:var(--muted)}.kv div:nth-child(even){word-break:break-word}
/* status */
#status{height:24px;border-top:1px solid var(--line);display:flex;align-items:center;padding:0 8px;gap:12px;flex:none;background:var(--bg);white-space:nowrap;user-select:none}
.bar{display:inline-block;vertical-align:middle;width:100px;height:6px;background:var(--line)}.bar>i{display:block;height:100%;background:var(--blue)}
/* menus + dialogs */
.menu{position:fixed;z-index:60;min-width:210px;background:var(--menu);border:1px solid var(--btnline);box-shadow:0 2px 8px rgba(0,0,0,.35);padding:2px 0}
.mi{padding:4px 12px;white-space:nowrap;display:flex;align-items:center;gap:10px;cursor:default}.mi:hover{background:var(--hov)}
.mi.off{opacity:.4;pointer-events:none}
.menu hr{border:0;border-top:1px solid var(--line);margin:3px 0}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:70;padding:12px}
.dlg{width:420px;max-width:100%;background:var(--bg);border:1px solid #4a86bd;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.dt{display:flex;justify-content:space-between;align-items:center;padding-left:10px}
.db{background:var(--rib);padding:12px;max-height:60vh;overflow:auto;line-height:1.5}
.df{background:var(--rib);padding:0 12px 12px;display:flex;justify-content:flex-end;gap:8px}
.btn{min-width:75px;padding:3px 10px;background:var(--btn);border:1px solid var(--btnline);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{background:#2d4a66;border-color:#0078D7;color:#fff}
.btn.pri{border-color:#0078D7}
.db input[type=text]{width:100%;height:24px;background:var(--input);border:1px solid var(--inputline);padding:0 6px;outline:0}
.db input[type=text]:focus{border-color:var(--focus)}
.db ol{margin:6px 0;padding-left:20px;line-height:1.8}
td{padding:2px 8px 2px 0;vertical-align:top}
/* viewer (images / pdf / text only) */
.viewer{position:fixed;inset:0;z-index:80;background:#101010;display:flex;flex-direction:column;color:#fff;padding-top:env(safe-area-inset-top,0px)}
.vtop{display:flex;align-items:center;gap:6px;padding-left:10px;background:#2b2b2b;color:#fff}
.vtop .ttl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vtop .btn{min-width:0;color:#fff;background:#3a3a3a;border-color:#666}
.stage{flex:1;min-height:0;position:relative;overflow:hidden}
.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.stage pre{position:absolute;inset:0;margin:0;padding:14px;overflow:auto;font:12px/1.5 Consolas,monospace;white-space:pre-wrap;word-break:break-word;color:#e8e8e8}
.stage .msg{position:absolute;inset:0;color:#ccc;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center}
@media (max-width:1280px){.tiles{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media (max-width:1100px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:860px){
#details{display:none!important}.row{grid-template-columns:minmax(150px,1fr) 80px}.row>:nth-child(2),.row>:nth-child(3),.row>:nth-child(5){display:none}.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:520px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ===== phone UI (html.m is set by script at <=700px wide) ===== */
#mbar,#mcr,#dscrim{display:none}
#mbar .mb{display:flex;align-items:center;height:52px}
.mbt{width:46px;height:52px;display:grid;place-items:center;flex:none;color:var(--text)}
.mbt:active{background:var(--hov)}.mbt.dim{opacity:.35}
.mtt{flex:1;min-width:0;padding:0 4px}
.mtt b{display:block;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mtt small{display:block;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#msearch input{flex:1;min-width:0;height:40px;background:var(--input);border:1px solid var(--inputline);padding:0 10px;font-size:16px;color:var(--text);outline:0}
.mch{flex:none;padding:6px 11px;border:1px solid var(--line);background:var(--rib);white-space:nowrap;font-size:13px;color:var(--text)}
.mrow{display:flex;align-items:center;gap:12px;padding:6px 12px;min-height:62px;border-bottom:1px solid var(--line)}
.mrow:active{background:var(--hov)}.mrow.sel{background:var(--sel)}
.mth{width:66px;height:46px;flex:none;position:relative;display:grid;place-items:center;overflow:hidden}
.mth img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.mth.has{background:#000}.mth.has>svg{display:none}
.mtx{flex:1;min-width:0}
.mn{font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.mm{color:var(--muted);font-size:12px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mck{width:22px;height:22px;border:2px solid var(--muted);display:grid;place-items:center;flex:none}
.mck svg{visibility:hidden}
.mrow.sel .mck{background:var(--blue);border-color:var(--blue);color:#fff}.mrow.sel .mck svg{visibility:visible}
.sh{place-items:end stretch!important;padding:0!important}
.shbg{position:absolute;inset:0}
.sheet{position:relative;width:100%;max-height:82vh;overflow:auto;background:var(--rib);border-top:1px solid #4a86bd;padding-bottom:env(safe-area-inset-bottom,0px)}
.shh{padding:12px 16px 6px;color:var(--muted);font-size:12px}
.shi{display:flex;align-items:center;gap:16px;padding:0 16px;min-height:52px;font-size:15px}
.shi:active{background:var(--hov)}.shi.off{opacity:.4;pointer-events:none}.shi .shr{margin-left:auto;display:flex}
.shf{padding:8px 16px}.shf label{display:block;color:var(--muted);margin-bottom:4px}
.shf select{width:100%;height:46px;background:var(--input);border:1px solid var(--inputline);padding:0 8px;font-size:16px;color:var(--text)}
html.m body{-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;touch-action:manipulation;overscroll-behavior:none}
html.m #mbar{display:block;background:var(--rib);border-bottom:1px solid var(--line);flex:none}
html.m #mcr{display:flex;gap:4px;overflow-x:auto;padding:6px 8px;border-bottom:1px solid var(--line);background:var(--bg);scrollbar-width:none;flex:none}
html.m #tabs,html.m #ribbon,html.m #addrrow,html.m #status,html.m #details{display:none!important}
html.m #body{border-top:0}
html.m #nav{position:fixed;left:0;top:0;bottom:0;width:min(84vw,310px);z-index:56;transform:translateX(-104%);transition:transform .18s;padding:env(safe-area-inset-top,0px) 0 20px;display:block!important}
html.m #nav.open{transform:none;box-shadow:0 0 26px rgba(0,0,0,.6)}
html.m .nv{height:46px;font-size:14px;gap:8px}
html.m .ar{width:34px;height:34px}
html.m body.drawer #dscrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:55}
html.m .ov:not(.sh){place-items:end stretch;padding:0}
html.m .dlg{width:100%;max-height:92vh}
html.m .btn{min-height:44px;min-width:88px}
html.m .df{flex-wrap:wrap}
html.m .db input[type=text],html.m input,html.m select{font-size:16px}
html.m .db input[type=text]{height:44px}
html.m .ri{font-size:16px;height:32px}
html.m .tiles{grid-template-columns:repeat(2,minmax(0,1fr));padding:6px;gap:4px}
html.m .cards{grid-template-columns:1fr}
html.m .sechd{margin:14px 12px 4px}
html.m .tile{padding:6px 4px 8px}
html.m .vtop{padding-left:4px}html.m .vtop .btn,html.m .wc{min-height:44px}
@media (min-width:520px){html.m .tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
/* ===== image gallery ===== */
.gal .vtop{background:rgba(32,32,32,.94)}
.gcount{color:#bbb;font-size:12px;min-width:64px;font-variant-numeric:tabular-nums}
.gal .stage{background:#101010}
.gal #gImg{transition:opacity .12s}
.gal #gImg.loading{opacity:.3}
.gnav{position:absolute;top:50%;transform:translateY(-50%);width:54px;height:100px;display:grid;place-items:center;background:rgba(0,0,0,.4);color:#fff;border:0;z-index:2;opacity:0;transition:opacity .15s;cursor:pointer}
.gal .stage:hover .gnav{opacity:1}.gnav:hover{background:rgba(0,0,0,.7)}.gnav:disabled{display:none}
.gnav.gl{left:0}.gnav.gr{right:0}
.gspin{position:absolute;left:50%;top:50%;margin:-17px 0 0 -17px;width:34px;height:34px;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite;display:none}.gspin.on{display:block}
@keyframes sp{to{transform:rotate(360deg)}}
.gstrip{height:76px;background:#1b1b1b;display:flex;gap:4px;overflow-x:auto;padding:7px 8px;flex:none;border-top:1px solid #333;scrollbar-width:thin}
.gth{flex:none;width:98px;height:62px;border:2px solid transparent;background:#000;opacity:.6;position:relative;cursor:pointer}
.gth img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.gth:hover{opacity:.9}.gth.on{border-color:var(--selline);opacity:1}
html.m .gnav{opacity:1;width:44px;height:76px;background:rgba(0,0,0,.35)}
html.m .gstrip{display:none}
</style>
</head>
<body>
<div id="win">
  <div id="mbar"><div id="mnorm" class="mb"></div><div id="msearch" class="mb" style="display:none"></div><div id="msel" class="mb" style="display:none"></div></div>
  <div id="mcr" style="display:none"></div>
  <div id="tabs"></div>
  <div id="ribbon"></div>
  <div id="addrrow">
    <div id="addrL"></div>
    <div id="crumbs"></div>
    <div style="position:relative;width:min(240px,32%)"><input id="q" autocomplete="off"><span id="qi" style="position:absolute;right:8px;top:6px;color:var(--muted);display:flex"></span></div>
  </div>
  <div id="body">
    <aside id="nav"></aside>
    <main id="main"></main>
    <aside id="details" class="dp"></aside>
  </div>
  <div id="status"></div>
  <div id="modal"></div>
  <div id="dscrim" data-a="drawer"></div>
</div>

{% raw %}
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const enc = encodeURIComponent;

const I = {

copy:'<rect width="14" height="14" x="8" y="8"/><path d="M4 16V4h12"/>',
trash:'<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><path d="M10 11v6"/><path d="M14 11v6"/>',
pencil:'<path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>',
'folder-plus':'<path d="M12 10v6"/><path d="M9 13h6"/><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>',
'folder-minus':'<path d="M9 13h6"/><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>',

async function api(url, opt = {}) {

  const r = await fetch(url, o);

  if (!r.ok) { let m = r.statusText; try { const j = await r.json(); m = j.detail || j.error || m; } catch (e) {} const err = new Error(m); err.status = r.status; throw err; }
  return r.json();
}

    case 'fav': return '/explorer/Favorites';

    case 'kind': return '/explorer/' + enc(KNAME[v.k]);

const msgbox = (title, text) => dlg(title, `<p style="margin:0">${esc(text)}</p>`, [{l: 'OK', pri: true}]);

/* ---------- actions ---------- */
const links = it => api('/api/explorer/links/' + it.id);
const vlcUri = l => 'vlc://play/' + enc(location.origin + l.stream_path);          // same /dl/<token>/<id>/<name> link as the admin panel's Copy Link
function launchUri(uri) { const a = document.createElement('a'); a.href = uri; a.style.display = 'none'; document.body.appendChild(a); a.click(); a.remove(); }
function vlcTarget(l, it) {
  const u = location.origin + l.stream_path;
  if (PLAT === 'android') { const x = new URL(u); return `intent://${x.host}${x.pathname}${x.search}#Intent;scheme=${x.protocol.slice(0, -1)};package=org.videolan.vlc;type=${it && it.kind === 'audio' ? 'audio' : 'video'}/*;end`; }
  if (PLAT === 'ios') return 'vlc-x-callback://x-callback-url/stream?url=' + enc(u);
  return vlcUri(l);
}
async function playVlc(it) {
  let l; try { l = await links(it); } catch (e) { return msgbox('Cannot play this file', e.message); }
  if (PLAT === 'win' && !LS.get('ex.vlcReady', '')) return vlcSetup(l);              // Windows: one-time setup, first time only
  if (PLAT === 'other') return launchUri(l.vlc_playlist);                            // macOS/Linux: playlist file that VLC opens
  launchUri(vlcTarget(l, it));                                                        // Android / iOS / Windows (after setup): VLC opens directly
}
function vlcSetup(l) {
  const dflt = (S.sum && S.sum.default_vlc_path) || 'C:\\Program Files\\VideoLAN\\VLC\\vlc.exe';
  dlg('One-time setup: open videos in VLC', `<p style="margin-top:0">A web page can only start VLC after Windows is told how. Do this <b>once</b> on this PC (VLC must be installed):</p>
    <ol><li>Download and open this file, then click <b>Yes</b> / <b>OK</b>:<br><a class="btn" id="regLink" href="/_ex/vlc-setup.reg" style="margin-top:4px">${ic('download', 14)} vlc-setup.reg</a></li>
    <li>Come back and press <b>Done</b>. If the browser asks “Open VLC?”, tick <b>Always allow</b>.</li></ol>
    <p>After that, double-clicking a video opens VLC straight away. Nothing else is shown.</p>
    <p style="margin-bottom:2px">VLC installed somewhere else?</p><input type="text" id="vlcPath" value="${esc(dflt)}">`,
    [{l: 'Cancel'}, {l: l ? 'Done — play now' : 'Done', pri: true, fn: () => { LS.set('ex.vlcReady', '1'); if (l) launchUri(vlcUri(l)); else flash('VLC setup saved'); }}]);
}
function openItem(k) {
  const it = byKey(k); if (!it) return;
  if (it.f) return go({t: 'folder', id: it.id});
  if (isMedia(it)) return playVlc(it);
  if (it.kind === 'image') return openGallery(it);
  if (it.ext === 'pdf') return viewer(it, `<iframe src="/_ex/preview/${it.id}/${enc(it.name)}"></iframe>`);
  if (['document', 'subtitle', 'other'].includes(it.kind)) return viewerText(it);
  download(it);
}
async function download(it) {                       // documents / images / archives only, never video or audio
  if (isMedia(it)) return;
  try { const l = await links(it); if (!l.download) return; const a = document.createElement('a'); a.href = l.download; a.download = it.name; document.body.appendChild(a); a.click(); a.remove(); } catch (e) { msgbox('Download failed', e.message); }
}
async function copyLink(it) {
  try { const l = await links(it); const u = location.origin + l.stream_path; await (navigator.clipboard ? navigator.clipboard.writeText(u) : Promise.reject()); flash('Link copied to clipboard'); }
  catch (e) { try { const l = await links(it); dlg('Stream link', `<input type="text" readonly value="${esc(location.origin + l.stream_path)}" onclick="this.select()">`, [{l: 'Close'}]); } catch (e2) { msgbox('Cannot copy link', e2.message); } }
}
async function moveFiles(ids, folderId) {
  try { const r = await api('/api/explorer/move', {method: 'POST', body: {file_ids: ids, folder_id: folderId}}); flash(`Moved ${r.moved} item${r.moved === 1 ? '' : 's'} (the Telegram files are untouched)`); await refreshSummary(); load(true); }
  catch (e) { flash(e.message); }
}
async function setFav(files, value) { try { await api('/api/explorer/favorite', {method: 'POST', body: {file_ids: files.map(i => i.id), value}}); files.forEach(i => i.favorite = value); await refreshSummary(); if (S.view.t === 'fav') load(true); else render(); } catch (e) { flash(e.message); } }
function folderOptions(onPick) {
  const tree = (p, d) => S.folders.filter(f => (f.parent_id || null) === p).map(f => `<div class="mi it" data-a="pick" data-v="${f.id}" style="padding-left:${10 + d * 16}px">${FOLDER_IC(16)}${esc(f.name)}</div>` + tree(f.id, d + 1)).join('');
  return tree(null, 0) || '<p style="margin:4px">There are no folders yet. Create one with “New folder”.</p>';
}
function moveDialog(ids) {
  dlg('Move Items', `<p style="margin-top:0">Choose where to move ${ids.length} item${ids.length > 1 ? 's' : ''}. Only the reference moves; the Telegram file stays where it is.</p><div style="border:1px solid var(--line);max-height:34vh;overflow:auto">${folderOptions()}</div>`, [{l: 'Cancel'}]);
  S._pickIds = ids;
}
async function newFolder() {
  const parent = S.view.t === 'folder' ? S.view.id : null;
  const sib = S.folders.filter(f => (f.parent_id || null) === parent).map(f => f.name.toLowerCase());
  let name = 'New folder', n = 2; while (sib.includes(name.toLowerCase())) name = `New folder (${n++})`;
  try {
    const f = await api('/api/explorer/folders', {method: 'POST', body: {name, parent_id: parent}});
    if (parent) { S.open.add(parent); saveOpen(); }
    await refreshSummary();
    if (S.view.t !== 'folder' && S.view.t !== 'folders') { S.tab = 'Home'; go({t: 'folders'}, true); await new Promise(r => setTimeout(r, 50)); }
    S.sel = new Set([fkey(f)]); S.ren = fkey(f); S.q = ''; $('#q').value = ''; render();
  } catch (e) { flash(e.message); }
}
async function commitRename(v) {
  const key = S.ren; S.ren = null; v = (v || '').trim(); const f = S.folders.find(x => 'f:' + x.id === key);
  if (!f || !v || v === f.name) { render(); return; }
  try { await api('/api/explorer/folders/' + f.id, {method: 'PATCH', body: {name: v}}); await refreshSummary(); S.sel = new Set(['f:' + f.id]); load(true); }
  catch (e) { flash(e.message); render(); }
}
function deleteFolder(f) {
  dlg('Delete Folder', `<p style="margin-top:0">Are you sure you want to delete “${esc(f.name)}”?</p><p>Its files and subfolders move up one level. <b>Nothing is deleted from Telegram.</b></p>`,
    [{l: 'Delete', pri: true, fn: async () => { try { await api('/api/explorer/folders/' + f.id, {method: 'DELETE'}); S.sel.clear(); if (S.view.t === 'folder' && S.view.id === f.id) go({t: 'folders'}); else { await refreshSummary(); load(true); } } catch (e) { flash(e.message); } }}, {l: 'Cancel'}]);
}
function props() {
  const one = sel1();
  if (!one) { const parts = crumbParts(); return dlg('Properties', `<div class="fx ac" style="gap:10px;margin-bottom:8px">${FOLDER_IC(36)}<b>${esc(parts[parts.length - 1][0])}</b></div><table><tr><td>Items:</td><td>${S.view.t === 'home' ? (S.sum?.total || 0) : S.total}</td></tr></table>`); }
  if (one.f) return dlg('Properties', `<div class="fx ac" style="gap:10px;margin-bottom:8px">${FOLDER_IC(36)}<b>${esc(one.name)}</b></div><table><tr><td>Type:</td><td>File folder (virtual)</td></tr><tr><td>Location:</td><td>${esc(folderPath(one.id).map(f => f.name).join(' › '))}</td></tr><tr><td>Contains:</td><td>${one.count} items</td></tr></table>`);
  dlg('Properties', `<div class="fx ac" style="gap:10px;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--line)">${iconOf(one, 36)}<b style="word-break:break-all">${esc(one.name)}</b></div><table>
    <tr><td>Type:</td><td>${esc(typeOf(one))} (${esc(one.mime || '')})</td></tr><tr><td>Size:</td><td>${fmtBig(one.size)} (${(+one.size).toLocaleString()} bytes)</td></tr><tr><td>Modified:</td><td>${fmtD(one.date)}</td></tr>
    ${one.duration ? `<tr><td>Length:</td><td>${fmtDur(one.duration)}</td></tr>` : ''}${one.width ? `<tr><td>Dimensions:</td><td>${one.width} × ${one.height}</td></tr>` : ''}
    <tr><td>Source channel:</td><td>${esc(one.channel)}</td></tr><tr><td>Message:</td><td>#${one.msg_id}</td></tr><tr><td>Folder:</td><td>${esc(one.folder_id ? folderPath(one.folder_id).map(f => f.name).join(' › ') : '—')}</td></tr>${one.kind === 'video' ? `<tr><td>Thumbnail:</td><td><a href="/api/explorer/thumb-debug/${one.id}" target="_blank" style="color:#3FA0F0">Diagnose</a></td></tr>` : ''}</table>`);
}
const saveOpen = () => LS.set('ex.open', JSON.stringify([...S.open]));
function setSort(k) { if (S.sort === k) S.order = S.order === 'asc' ? 'desc' : 'asc'; else { S.sort = k; S.order = (k === 'date' || k === 'size') ? 'desc' : 'asc'; } LS.set('ex.sort', S.sort); LS.set('ex.order', S.order); load(true); }
async function startSync(full) { try { const r = await api('/api/explorer/sync', {method: 'POST', body: {full}}); flash(r.message); if (r.ok) { await refreshSummary(); pollSync(); } } catch (e) { flash(e.message); } }
function syncUI(st) { if (st && st.running) pollSync(); }
function pollSync() {
  if (S.syncPoll) return;
  S.syncPoll = setInterval(async () => {
    try { const st = await api('/api/explorer/sync/status'); S.sum.status = st; ribbon(); status();
      if (!st.running) { clearInterval(S.syncPoll); S.syncPoll = null; await refreshSummary(); load(true); if (st.state === 'error') msgbox('Sync failed', st.error); }
    } catch (e) {}
  }, 2000);
}

function paintSel() {
  document.querySelectorAll('#main [data-a="sel"]').forEach(el => el.classList.toggle('sel', S.sel.has(el.dataset.v)));
  if (isM()) { if (!S.selMode && document.querySelector('#main .mck')) render(); else mbar(); }
  else { ribbon(); details(); status(); }
}
const ACT = {
  tab: v => { S.tab = v; }, go: v => go(JSON.parse(v)),
  tg: v => { S.open.has(v) ? S.open.delete(v) : S.open.add(v); saveOpen(); },
  back: () => history.back(), fwd: () => history.forward(), rec: () => { S.menu = !S.menu; },
  recgo: v => { const r = S.recent[+v]; S.menu = 0; if (r) go(r.v); },
  up: () => { const v = S.view; if (v.t === 'folder') { const f = S.folders.find(x => x.id === v.id); go(f && f.parent_id ? {t: 'folder', id: f.parent_id} : {t: 'folders'}); } else if (v.t !== 'home') go({t: 'home'}); },
  refresh: () => { refreshSummary().then(() => load(true)); },
  sel: (v, e) => {
    if (S.ren === v) return;
    if (isM()) { if (S.selMode) { S.sel.has(v) ? S.sel.delete(v) : S.sel.add(v); if (!S.sel.size) S.selMode = false; S.last = v; } else { S.sel = new Set(); setTimeout(() => openItem(v), 0); } return; }   // phone: tap opens, long-press selects
    if (e && (e.ctrlKey || e.metaKey)) { S.sel.has(v) ? S.sel.delete(v) : S.sel.add(v); }
    else if (e && e.shiftKey && S.last) { const ids = rows().map(r => r.k), a = ids.indexOf(S.last), b = ids.indexOf(v); if (a >= 0 && b >= 0) S.sel = new Set(ids.slice(Math.min(a, b), Math.max(a, b) + 1)); }
    else { S.sel = new Set([v]); S.ren = null; if (matchMedia('(pointer:coarse)').matches) { S.last = v; setTimeout(() => openItem(v), 0); } }
    S.last = v;
  },
  clr: () => { S.sel.clear(); S.ren = null; }, more: () => load(),
  view: v => { if (isM()) { S.mmode = v === 'icons' ? 'grid' : 'list'; LS.set('ex.mmode', S.mmode); } else { S.mode = v; LS.set('ex.mode', v); } },
  sort: v => setSort(v),
  sortmenu: (v, e, el) => { const r = el.getBoundingClientRect(); showMenu({clientX: r.left, clientY: r.bottom}, [...[['name', 'Name'], ['date', 'Date modified'], ['type', 'Type'], ['size', 'Size']].map(([k, l]) => ({label: (S.sort === k ? '● ' : '○ ') + l, fn: () => setSort(k)})), '-', {label: (S.order === 'asc' ? '● ' : '○ ') + 'Ascending', fn: () => { S.order = 'asc'; LS.set('ex.order', 'asc'); load(true); }}, {label: (S.order === 'desc' ? '● ' : '○ ') + 'Descending', fn: () => { S.order = 'desc'; LS.set('ex.order', 'desc'); load(true); }}]); },
  navp: () => { S.showNav = !S.showNav; LS.set('ex.nav', S.showNav ? '1' : '0'); }, detp: () => { S.showDet = !S.showDet; LS.set('ex.det', S.showDet ? '1' : '0'); },
  ext: () => { S.showExt = !S.showExt; LS.set('ex.ext', S.showExt ? '1' : '0'); }, dark: () => { LS.set('ex.theme', isDark() ? 'light' : 'dark'); applyTheme(); },
  fav: () => { const f = selFiles(); if (f.length) setFav(f, !f.every(i => i.favorite)); },
  copylink: () => { const one = sel1(); if (one && !one.f) copyLink(one); },
  move: () => { const f = selFiles(); if (f.length) moveDialog(f.map(i => i.id)); },
  unfile: () => { const f = selFiles().filter(i => i.folder_id); if (f.length) moveFiles(f.map(i => i.id), null); },
  pick: v => { const ids = S._pickIds || []; S.modal = null; moveFiles(ids, v); },
  del: () => { const f = selFolder(); if (f) deleteFolder(f); },
  ren: () => { const f = selFolder(); if (f) S.ren = fkey(f); },
  newf: () => { newFolder(); },
  open: () => { const k = [...S.sel][0]; if (S.sel.size === 1) openItem(k); },
  props: () => props(),
  stremio: async () => { const one = sel1(); if (!one || one.f) return; try { const l = await links(one); if (l.stremio) window.open(l.stremio.url, '_blank'); else msgbox('Open in Stremio', 'This file is not in your Stremio catalog (it has no matching movie or series entry).'); } catch (e) { msgbox('Open in Stremio', e.message); } },
  dl: () => { const one = sel1(); if (one && !one.f) download(one); },
  m3u: async () => { const one = sel1(); if (!one || one.f) return; try { const l = await links(one); const a = document.createElement('a'); a.href = l.vlc_playlist; a.download = ''; document.body.appendChild(a); a.click(); a.remove(); } catch (e) { msgbox('VLC playlist', e.message); } },
  sync: () => { const st = S.sum && S.sum.status; if (st && st.running) dlg('Stop indexing?', '<p style="margin:0">Stop scanning your Telegram channels now? Progress is kept and resumes next time.</p>', [{l: 'Stop', pri: true, fn: () => api('/api/explorer/sync/cancel', {method: 'POST'})}, {l: 'Cancel'}]); else dlg('Sync Telegram files', '<p style="margin-top:0">Scans your configured channels for new files and resumes where it last stopped. New uploads are also indexed live automatically.</p><p style="margin-bottom:0;color:var(--muted)">The bot posts and instantly deletes a tiny probe message in each channel to find its newest message id, like the admin Scan tool.</p>', [{l: 'Sync now', pri: true, fn: () => startSync(false)}, {l: 'Cancel'}]); },
  fullsync: () => dlg('Full re-index', '<p style="margin:0">Re-scan every message from the beginning? This can take a while on large channels and also removes entries for deleted messages.</p>', [{l: 'Re-index', pri: true, fn: () => startSync(true)}, {l: 'Cancel'}]),
  vlcsetup: () => vlcSetup(null), admin: () => { location.href = '/'; },
  mclose: () => { S.modal = null; },
  mbtn: v => { const b = (S.modal.btns || [{l: 'Close'}])[+v]; S.modal = null; render(); if (b && b.fn) b.fn(); return 'done'; },
  drawer: () => { S.drawer = !S.drawer; },
  msearch: () => { S.msearch = true; setTimeout(() => { const i = $('#mq'); if (i) i.focus(); }, 30); },
  msclose: () => { S.msearch = false; if (S.q) { S.q = ''; $('#q').value = ''; $('#mq').value = ''; syncUrl(true); load(true); } },
  mqclear: () => { $('#mq').value = ''; $('#q').value = ''; if (S.q) { S.q = ''; syncUrl(true); load(true); } setTimeout(() => $('#mq').focus(), 30); },
  selx: () => { S.selMode = false; S.sel.clear(); },
  selall: () => { S.sel = new Set(rows().map(r => r.k)); },
  mmore: () => mMenu(), selmore: () => mSelMenu(),
  shi: v => { const e = S.modal.entries[+v]; S.modal = null; render(); if (e && e.fn) e.fn(); return 'done'; },
  _: 0
};
document.addEventListener('click', e => {
  if (S._lp) { S._lp = false; return; }
  if (!e.target.closest('.menu')) closeMenu();
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'OPTION') return;
  const el = e.target.closest('[data-a]');
  if (!el) { if (S.menu) { S.menu = 0; addr(); } return; }
  const a = el.dataset.a;
  if (e.target.closest('a[href]') && el.tagName === 'A' && a === 'go' && (e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0)) return;   // let "open in new tab" work
  if (e.target.closest('a[href]')) e.preventDefault();
  if (a !== 'rec') S.menu = 0;
  if (S.ren) { const i = $('#ri'); if (i && !(a === 'sel' && el.dataset.v === S.ren)) { commitRename(i.value); return; } }
  if (ACT[a]?.(el.dataset.v, e, el) === 'done') return;
  if (a === 'sel' || a === 'clr') { paintSel(); return; }       // only change the highlight; the tiles themselves stay, so double-click works
  render();
});
document.addEventListener('dblclick', e => {
  if (e.target.tagName === 'INPUT') return;
  const el = e.target.closest('[data-a="sel"]'); if (el) openItem(el.dataset.v);       // folder -> opens; video/audio -> straight into VLC
});
document.addEventListener('change', e => {
  if (e.target.id === 'fKind') { S.kind = e.target.value; if (S.view.t === 'home' && S.kind) go({t: 'all'}); else load(true); }
  if (e.target.id === 'fChan') { S.chan = e.target.value; if (S.view.t === 'home' && S.chan) go({t: 'all'}); else load(true); }
});
document.addEventListener('input', e => { if (e.target.id === 'vlcPath') { const a = $('#regLink'); if (a) a.href = '/_ex/vlc-setup.reg?path=' + enc(e.target.value.trim()); } });
document.addEventListener('focusout', e => { if (e.target.id === 'ri' && S.ren) commitRename(e.target.value); });
let qt; const onQ = e => { clearTimeout(qt); qt = setTimeout(() => { S.q = e.target.value.trim(); $('#q').value = $('#mq').value = e.target.value; syncUrl(true); load(true); }, 300); };
$('#q').addEventListener('input', onQ);
$('#main').addEventListener('scroll', e => { const c = e.target; if (!S.done && !S.loading && S.view.t !== 'home' && c.scrollTop + c.clientHeight > c.scrollHeight - 500) load(); });

/* ---------- context menus ---------- */
function closeMenu() { document.querySelectorAll('.menu.ctx').forEach(m => m.remove()); }
function showMenu(ev, entries) {
  closeMenu();
  const m = document.createElement('div'); m.className = 'menu ctx';
  m.innerHTML = entries.map((x, i) => x === '-' ? '<hr>' : `<div class="mi${x.off ? ' off' : ''}" data-i="${i}">${esc(x.label)}</div>`).join('');
  document.body.appendChild(m);
  m.style.left = Math.max(2, Math.min(ev.clientX, innerWidth - m.offsetWidth - 4)) + 'px'; m.style.top = Math.max(2, Math.min(ev.clientY, innerHeight - m.offsetHeight - 4)) + 'px';
  m.querySelectorAll('.mi').forEach(el => el.onclick = e => { e.stopPropagation(); closeMenu(); entries[+el.dataset.i].fn(); });
}
document.addEventListener('contextmenu', e => {
  if (isM()) { e.preventDefault(); return; }       // phone: long-press is handled by the touch handler below
  const el = e.target.closest('[data-a="sel"]');
  if (e.target.closest('#modal,#details,.viewer,#ribbon,#addrrow,#status')) return;
  e.preventDefault();
  if (!el) { if (e.target.closest('#main')) { S.sel.clear(); render(); showMenu(e, [{label: 'View: Large icons', fn: () => { ACT.view('icons'); render(); }}, {label: 'View: Details', fn: () => { ACT.view('details'); render(); }}, '-', {label: 'Refresh', fn: () => ACT.refresh()}, '-', {label: 'New folder', fn: newFolder}]); } return; }
  const k = el.dataset.v; if (!S.sel.has(k)) { S.sel = new Set([k]); render(); }
  const one = sel1(), files = selFiles();
  if (S.sel.size === 1 && one.f) return showMenu(e, [{label: 'Open', fn: () => go({t: 'folder', id: one.id})}, {label: 'Copy folder link', fn: () => { const u = location.origin + viewToPath({t: 'folder', id: one.id}); (navigator.clipboard ? navigator.clipboard.writeText(u) : Promise.reject()).then(() => flash('Folder link copied'), () => dlg('Folder link', `<input type="text" readonly value="${esc(u)}" onclick="this.select()">`, [{l: 'Close'}])); }}, '-', {label: 'Rename', fn: () => { S.ren = fkey(one); render(); }}, {label: 'Delete', fn: () => deleteFolder(one)}, '-', {label: 'Properties', fn: props}]);
  const multi = files.length > 1, f1 = files[0]; if (!f1) return;
  const out = [{label: multi ? `Open ${files.length} items` : (isMedia(f1) ? 'Play in VLC' : 'Open'), fn: () => openItem(f1.id)}];
  if (!multi && !isMedia(f1)) out.push({label: 'Download', fn: () => download(f1)});
  if (!multi) out.push({label: 'Copy link', fn: () => copyLink(f1)});
  out.push('-', {label: files.every(i => i.favorite) ? 'Remove from Favorites' : 'Add to Favorites', fn: () => setFav(files, !files.every(i => i.favorite))}, {label: 'Move to…', fn: () => moveDialog(files.map(i => i.id))});
  if (files.some(i => i.folder_id)) out.push({label: 'Remove from folder', fn: () => moveFiles(files.filter(i => i.folder_id).map(i => i.id), null)});
  out.push('-', {label: 'Properties', fn: props});
  showMenu(e, out);
});

/* ---------- drag & drop: move references between virtual folders ---------- */
document.addEventListener('dragstart', e => {
  const el = e.target.closest('[data-id]'); if (!el) return;
  if (!S.sel.has(el.dataset.id)) { S.sel = new Set([el.dataset.id]); document.querySelectorAll('.it.sel').forEach(x => x.classList.remove('sel')); el.classList.add('sel'); }
  e.dataTransfer.setData('text/x-explorer', JSON.stringify(selFiles().map(i => i.id))); e.dataTransfer.effectAllowed = 'move';
});
const clearDrop = () => document.querySelectorAll('.drop').forEach(x => x.classList.remove('drop'));
document.addEventListener('dragover', e => { const t = e.target.closest('[data-drop]'); clearDrop(); if (t && e.dataTransfer.types.includes('text/x-explorer')) { e.preventDefault(); t.classList.add('drop'); } });
document.addEventListener('dragend', clearDrop);
document.addEventListener('drop', e => {
  const t = e.target.closest('[data-drop]'); clearDrop(); if (!t) return;
  const raw = e.dataTransfer.getData('text/x-explorer'); if (!raw) return; e.preventDefault();
  moveFiles(JSON.parse(raw), t.dataset.drop === 'root' ? null : t.dataset.drop);
});

/* ---------- phone: long-press an item to start selecting ---------- */
let lpT = null, lpX = 0, lpY = 0;
const lpClear = () => { clearTimeout(lpT); lpT = null; };
document.addEventListener('touchstart', e => {
  if (!isM() || e.touches.length !== 1) return;
  const el = e.target.closest('[data-a="sel"]'); if (!el || S.ren) return;
  lpX = e.touches[0].clientX; lpY = e.touches[0].clientY; lpClear();
  lpT = setTimeout(() => { lpT = null; S._lp = true; clearTimeout(S._lpf); S._lpf = setTimeout(() => { S._lp = false; }, 4000); if (navigator.vibrate) try { navigator.vibrate(15); } catch (x) {} S.selMode = true; S.sel = new Set([el.dataset.v]); S.last = el.dataset.v; render(); }, 450);
}, {passive: true});
document.addEventListener('touchmove', e => { if (lpT && (Math.abs(e.touches[0].clientX - lpX) > 10 || Math.abs(e.touches[0].clientY - lpY) > 10)) lpClear(); }, {passive: true});
const lpEnd = () => { lpClear(); if (S._lp) { clearTimeout(S._lpf); S._lpf = setTimeout(() => { S._lp = false; }, 350); } };   // swallow only the click that ends the long-press
document.addEventListener('touchend', lpEnd); document.addEventListener('touchcancel', lpEnd);

/* ---------- keyboard ---------- */
document.addEventListener('keydown', e => {
  if (e.target.id === 'ri') { if (e.key === 'Enter') { e.preventDefault(); commitRename(e.target.value); } if (e.key === 'Escape') { S.ren = null; render(); } return; }
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (document.querySelector('.viewer')) return;
  if (S.modal) { if (e.key === 'Escape') { S.modal = null; render(); } return; }
  if (e.key === 'Delete' && selFolder()) { ACT.del(); render(); }
  else if (e.key === 'F2' && selFolder()) { ACT.ren(); render(); }
  else if (e.key === 'Enter' && S.sel.size === 1) openItem([...S.sel][0]);
  else if (e.key === 'Backspace') { e.preventDefault(); history.back(); }
  else if ((e.ctrlKey || e.metaKey) && e.key === 'a') { e.preventDefault(); S.sel = new Set(rows().map(r => r.k)); render(); }
  else if (e.key === 'Escape') { S.sel.clear(); closeMenu(); render(); }
  else if (e.key === '/' || ((e.ctrlKey || e.metaKey) && e.key === 'f')) { e.preventDefault(); $('#q').focus(); }
});

/* ---------- image gallery: step through the images of the current list with ← / → (or swipe) ---------- */
let G = null, galPushed = false, ignorePop = false;
const gImages = () => S.items.filter(x => x.kind === 'image');
const gUrl = x => `/_ex/preview/${x.id}/${enc(x.name)}`;
function closeGallery(fromPop) {
  if (!G) return;
  document.removeEventListener('keydown', G.key); G.el.remove(); G = null;
  if (!fromPop && galPushed) { ignorePop = true; history.back(); }          // drop the history entry we added when opening
  galPushed = false;
}
function openGallery(it) {
  closeViewer(); closeGallery(true);
  const list = gImages(); if (!list.length) return;
  const el = document.createElement('div'); el.className = 'viewer gal';
  el.innerHTML = `<div class="vtop"><span class="gcount" id="gCount"></span><span class="ttl" id="gTitle"></span><button class="btn" id="gDl">${ic('download', 14)} Download</button><button class="wc x" id="gClose" aria-label="Close">${ic('x', 14)}</button></div>
    <div class="stage" id="gStage"><button class="gnav gl" id="gPrev" aria-label="Previous image">${ic('chevron-right', 34, '#fff', 'none', 2).replace('<svg ', '<svg style="transform:scaleX(-1)" ')}</button><img id="gImg" alt=""><div class="gspin" id="gSpin"></div><div class="msg" id="gErr" style="display:none"></div><button class="gnav gr" id="gNext" aria-label="Next image">${ic('chevron-right', 34, '#fff', 'none', 2)}</button></div>
    <div class="gstrip" id="gStrip"></div>`;
  document.body.appendChild(el);
  G = {el, list, i: Math.max(0, list.findIndex(x => x.id === it.id)), tok: 0};
  history.pushState({gallery: 1}, '', location.href); galPushed = true;      // phone Back button closes the viewer instead of leaving the page
  const q = s => el.querySelector(s);
  q('#gClose').onclick = () => closeGallery(); q('#gDl').onclick = () => download(G.list[G.i]);
  q('#gPrev').onclick = () => gStep(-1); q('#gNext').onclick = () => gStep(1);
  G.key = e => {
    if (document.querySelector('.scrim')) return;
    if (e.key === 'ArrowLeft') { e.preventDefault(); gStep(-1); } else if (e.key === 'ArrowRight') { e.preventDefault(); gStep(1); }
    else if (e.key === 'Home') gShow(0); else if (e.key === 'End') gShow(G.list.length - 1); else if (e.key === 'Escape') closeGallery();
  };
  document.addEventListener('keydown', G.key);
  let sx = 0, sy = 0;
  const st = q('#gStage');
  st.addEventListener('touchstart', e => { if (e.touches.length === 1) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; } }, {passive: true});
  st.addEventListener('touchend', e => { const t = e.changedTouches && e.changedTouches[0]; if (!t) return; const dx = t.clientX - sx, dy = t.clientY - sy; if (Math.abs(dx) > 50 && Math.abs(dy) < 80) gStep(dx < 0 ? 1 : -1); }, {passive: true});
  gShow(G.i);
}
const gStep = d => { if (G) gShow(G.i + d); };
function gShow(i) {
  if (!G) return;
  G.list = gImages().length >= G.list.length ? gImages() : G.list;           // new pages loaded in the background extend the list
  i = Math.max(0, Math.min(G.list.length - 1, i)); G.i = i;
  const it = G.list[i], el = G.el, q = s => el.querySelector(s), tok = ++G.tok;
  q('#gTitle').textContent = it.name; q('#gTitle').title = it.name;
  q('#gCount').textContent = `${i + 1} / ${G.list.length}${S.done || S.view.t === 'home' ? '' : '+'}`;
  q('#gPrev').disabled = i === 0; q('#gNext').disabled = i === G.list.length - 1 && (S.done || S.view.t === 'home');
  const img = q('#gImg'), spin = q('#gSpin'), err = q('#gErr'); err.style.display = 'none'; img.style.display = ''; img.classList.add('loading'); spin.classList.add('on');
  const pre = new Image();
  pre.onload = () => { if (!G || G.tok !== tok) return; img.src = gUrl(it); img.classList.remove('loading'); spin.classList.remove('on'); };
  pre.onerror = () => { if (!G || G.tok !== tok) return; spin.classList.remove('on'); img.style.display = 'none'; err.style.display = ''; err.innerHTML = '<div>Could not load this picture from Telegram.</div>'; };
  pre.src = gUrl(it);
  [i + 1, i - 1, i + 2].forEach(j => { const x = G.list[j]; if (x) new Image().src = gUrl(x); });          // preload neighbours so stepping feels instant
  // filmstrip around the current picture
  const from = Math.max(0, Math.min(i - 5, G.list.length - 11)), to = Math.min(G.list.length, from + 11);
  q('#gStrip').innerHTML = G.list.slice(from, to).map((x, k) => `<div class="gth${from + k === i ? ' on' : ''}" data-j="${from + k}" title="${esc(x.name)}"><img alt="" src="/_ex/thumb/${x.id}" onerror="this.remove()"></div>`).join('');
  q('#gStrip').querySelectorAll('.gth').forEach(t => t.onclick = () => gShow(+t.dataset.j));
  const cur = q('#gStrip .gth.on'); if (cur && cur.scrollIntoView) cur.scrollIntoView({inline: 'center', block: 'nearest'});
  // reaching the end of what is loaded: fetch the next page and carry on
  if (i >= G.list.length - 3 && !S.done && !S.loading && S.view.t !== 'home') load().then(() => { if (G) { G.list = gImages(); gShow(G.i); } });
}

/* ---------- PDF / text viewer (videos and audio never come here: they open in VLC) ---------- */
let V = null;
function closeViewer() { if (!V) return; document.removeEventListener('keydown', V.key); V.el.remove(); V = null; }
function viewer(it, inner) {
  closeViewer();
  const el = document.createElement('div'); el.className = 'viewer';
  el.innerHTML = `<div class="vtop"><span style="display:flex">${iconOf(it, 16)}</span><span class="ttl" title="${esc(it.name)}">${esc(it.name)}</span><button class="btn" id="vDl">${ic('download', 14)} Download</button><button class="wc x" id="vClose">${ic('x', 14)}</button></div><div class="stage" id="stage">${inner}</div>`;
  document.body.appendChild(el); V = {el, it};
  V.key = e => { if (e.key === 'Escape') closeViewer(); }; document.addEventListener('keydown', V.key);
  $('#vClose', el).onclick = closeViewer; $('#vDl', el).onclick = () => download(it);
  const img = $('#stage img'); if (img) img.onerror = () => { $('#stage').innerHTML = '<div class="msg">Could not load this file from Telegram.</div>'; };
}
async function viewerText(it) {
  viewer(it, '<div class="msg">Loading…</div>');
  try { const r = await api('/api/explorer/text/' + it.id); $('#stage').innerHTML = `<pre>${esc(r.text)}${r.truncated ? '\n\n… (preview truncated. Download for the full file.)' : ''}</pre>`; }
  catch (e) { $('#stage').innerHTML = `<div class="msg"><div>No preview is available for this file type.</div><button class="btn" id="dl2">${ic('download', 14)} Download</button></div>`; $('#dl2').onclick = () => download(it); }
}

/* ---------- boot ---------- */
(async () => {
  S.q = new URLSearchParams(location.search).get('q') || ''; $('#q').value = S.q;
  $('#msearch').innerHTML = `<button class="mbt" data-a="msclose" aria-label="Close search">${ic('arrow-left', 20)}</button><input id="mq" type="search" placeholder="Search" autocomplete="off"><button class="mbt" data-a="mqclear" aria-label="Clear">${ic('x', 18)}</button>`;
  $('#mq').value = S.q; $('#mq').addEventListener('input', onQ); if (S.q) S.msearch = true;
  const onMode = () => { S.drawer = false; render(); }; MQ.addEventListener ? MQ.addEventListener('change', onMode) : MQ.addListener(onMode);
  applyMode(); render();
  try { S.sum = await api('/api/explorer/summary'); S.folders = S.sum.folders; syncUI(S.sum.status); } catch (e) { flash(e.message); }
  if (S.sum && S.sum.kinds.video && !S.sum.thumb_installed) setTimeout(() => flash('Tip: thumbnails for MKV files need the "av" package (see EXPLORER.md).'), 1200);
  let v = pathToView(location.pathname);
  if (!v) { v = {t: 'home'}; flash('That folder was not found.'); }
  S.view = v; S.recent = [{v, label: crumbParts().slice(-1)[0][0]}]; syncUrl(true); render(); load(true);
})();
})();
</script>
